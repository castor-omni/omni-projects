# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__int_fhir__conditions
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: INT_FHIR__CONDITIONS

dimensions:
  asserted_date:
    sql: '"ASSERTED_DATE"'

  onset_ts:
    sql: '"ONSET_TS"'

  abatement_ts:
    sql: '"ABATEMENT_TS"'

  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID

  name:
    sql: '"NAME"'

  code:
    sql: '"CODE"'

  clinical_status:
    sql: '"CLINICAL_STATUS"'

  verification_status:
    sql: '"VERIFICATION_STATUS"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__conditions
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      timestampadd(year, extract(year, current_date()) - 2016, asserted_date) as asserted_date,
      timestampadd(year, extract(year, current_date()) - 2016, onset_ts) as onset_ts,
      timestampadd(year, extract(year, current_date()) - 2016, abatement_ts) as abatement_ts,
      {{ dbt_utils.star(ref('stg_fhir__conditions'), except=["asserted_date", "onset_ts", "abatement_ts"]) }}
    from {{ ref('stg_fhir__conditions') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, asserted_date)
        < current_date()
  referenced_by: [ conditions ]
