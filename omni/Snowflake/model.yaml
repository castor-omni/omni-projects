ai_context: |
  @{tone}

  When generating a query, briefly cover the following in your response before running it, keeping each section to one or two short sentences:

  1. Under the header "Reasoning for field selection", explain why you picked the fields.
  2. Under the header "Alternative approaches considered", mention one or two alternative queries or fields you could have chosen.
  3. Under the header "Follow-up questions", add 3 markdown links as follow up questions.

cache_policies:
  daily_cache_policy:
    max_cache_age: 0 hours

