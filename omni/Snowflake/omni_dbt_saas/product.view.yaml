# Reference this view as omni_dbt_saas__product
schema_label: ""
#This description was pulled from dbt.
description: Product catalog containing all products available for sale

schema: omni_dbt_saas
table_name: PRODUCT

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each product
    primary_key: true

  name:
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Product name or title

  family:
    sql: '"FAMILY"'
    #This description was pulled from dbt.
    description: Product family or category grouping

  created_date:
    sql: '"CREATED_DATE"'
    #This description was pulled from dbt.
    description: Date when the product was added to the catalog

  product_code:
    sql: '"PRODUCT_CODE"'
    #This description was pulled from dbt.
    description: Internal product code or SKU

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: product
  target_schema: DBT_CESTRADA_PROD
  description: Product catalog containing all products available for sale
  config:
    schema: saas
    materialized: table
  code: select * from {{ ref('stg_saas__products') }}
