# Reference this view as analytics_dev_dbt_cestrada_prod_finance__transactions
#This description was pulled from dbt.
description: Complete record of all trading activity and asset movements. Each
  row represents a single buy, sell, or transfer transaction.

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FINANCE
table_name: TRANSACTIONS

dimensions:
  transaction_id:
    sql: '"TRANSACTION_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each transaction

  client_id:
    sql: '"CLIENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the client who initiated or owns this transaction

  portfolio_id:
    sql: '"PORTFOLIO_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the portfolio this transaction belongs to

  asset_id:
    sql: '"ASSET_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the specific asset being traded

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the account where this transaction occurred

  transaction_type:
    sql: '"TRANSACTION_TYPE"'
    #This description was pulled from dbt.
    description: Type of transaction

  quantity:
    sql: '"QUANTITY"'
    #This description was pulled from dbt.
    description: Number of units/shares traded

  price_per_unit:
    sql: '"PRICE_PER_UNIT"'
    #This description was pulled from dbt.
    description: Price paid or received per unit of the asset

  total_amount:
    sql: '"TOTAL_AMOUNT"'
    #This description was pulled from dbt.
    description: Total monetary value of the transaction

  fees:
    sql: '"FEES"'
    #This description was pulled from dbt.
    description: Transaction fees, commissions, or other costs associated with the trade

  created_at:
    sql: '"CREATED_AT"'
    #This description was pulled from dbt.
    description: Date and time when the transaction was executed or recorded

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: transactions
  target_schema: DBT_CESTRADA_PROD
  description: Complete record of all trading activity and asset movements. Each
    row represents a single buy, sell, or transfer transaction.
  config:
    schema: finance
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_asset_management__fct_transactions')) }}
    from {{ ref('stg_asset_management__fct_transactions') }}
