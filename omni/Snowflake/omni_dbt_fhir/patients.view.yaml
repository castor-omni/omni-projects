# Reference this view as omni_dbt_fhir__patients
schema_label: ""
#This description was pulled from dbt.
description: Contains demographic and identifying information about patients

schema: omni_dbt_fhir
table_name: PATIENTS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the patient
    primary_key: true

  family_name:
    sql: '"FAMILY_NAME"'
    #This description was pulled from dbt.
    description: Family name (surname) of the patient

  given_names:
    sql: '"GIVEN_NAMES"'
    #This description was pulled from dbt.
    description: Given name(s) of the patient

  phone_number:
    sql: '"PHONE_NUMBER"'
    #This description was pulled from dbt.
    description: Patient's phone number

  birth_date:
    sql: '"BIRTH_DATE"'
    #This description was pulled from dbt.
    description: Patient's date of birth

  deceased_ts:
    sql: '"DECEASED_TS"'
    #This description was pulled from dbt.
    description: Timestamp of patient's death, if applicable

  gender:
    sql: '"GENDER"'
    #This description was pulled from dbt.
    description: Patient's gender

  marital_status:
    sql: '"MARITAL_STATUS"'
    #This description was pulled from dbt.
    description: Patient's marital status

  multiple_birth:
    sql: '"MULTIPLE_BIRTH"'
    #This description was pulled from dbt.
    description: Indicates if the patient is part of a multiple birth

  city:
    sql: '"CITY"'
    #This description was pulled from dbt.
    description: City of patient's address

  country:
    sql: '"COUNTRY"'
    #This description was pulled from dbt.
    description: Country of patient's address

  postal_code:
    sql: '"POSTAL_CODE"'
    #This description was pulled from dbt.
    description: Postal code of patient's address

  state:
    sql: '"STATE"'
    #This description was pulled from dbt.
    description: State or province of patient's address

  address_line_1:
    sql: '"ADDRESS_LINE_1"'
    #This description was pulled from dbt.
    description: First line of patient's address

  address_line_2:
    sql: '"ADDRESS_LINE_2"'
    #This description was pulled from dbt.
    description: Second line of patient's address

  latitude:
    sql: '"LATITUDE"'
    #This description was pulled from dbt.
    description: Latitude of patient's address

  longitude:
    sql: '"LONGITUDE"'
    #This description was pulled from dbt.
    description: Longitude of patient's address

  race:
    sql: '"RACE"'
    #This description was pulled from dbt.
    description: Patient's race

  ethnicity:
    sql: '"ETHNICITY"'
    #This description was pulled from dbt.
    description: Patient's ethnicity

  birth_sex:
    sql: '"BIRTH_SEX"'
    #This description was pulled from dbt.
    description: Patient's sex at birth

  birth_place:
    sql: '"BIRTH_PLACE"'
    #This description was pulled from dbt.
    description: Patient's place of birth

  mothers_maiden_name:
    sql: '"MOTHERS_MAIDEN_NAME"'
    #This description was pulled from dbt.
    description: Mother's maiden name

  interpreter_required:
    sql: '"INTERPRETER_REQUIRED"'
    #This description was pulled from dbt.
    description: Indicates if the patient requires an interpreter

  ssn:
    sql: '"SSN"'
    #This description was pulled from dbt.
    description: Patient's Social Security Number

  resource_raw:
    sql: '"RESOURCE_RAW"'
    #This description was pulled from dbt.
    description: Raw FHIR resource data for the patient

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: patients
  target_schema: DBT_CESTRADA_PROD
  description: Contains demographic and identifying information about patients
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_fhir__patients')) }}
    from {{ ref('int_fhir__patients') }}
