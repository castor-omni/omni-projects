# Reference this view as analytics_dev_dbt_cestrada_dev__contact_js
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_DEV
table_name: CONTACT_JS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  first_name:
    sql: '"FIRST_NAME"'

  last_name:
    sql: '"LAST_NAME"'

  email:
    sql: '"EMAIL"'

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

measures:
  count:
    aggregate_type: count
