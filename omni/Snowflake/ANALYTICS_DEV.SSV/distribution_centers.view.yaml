# Reference this view as analytics_dev_ssv__distribution_centers
catalog: ANALYTICS_DEV
schema: SSV
table_name: DISTRIBUTION_CENTERS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  name:
    sql: '"NAME"'

  latitude:
    sql: '"LATITUDE"'

  longitude:
    sql: '"LONGITUDE"'

measures:
  count:
    aggregate_type: count
