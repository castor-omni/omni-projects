# Reference this view as omni_dbt_fhir__observations
schema_label: ""
#This description was pulled from dbt.
description: Contains information about patient observations or measurements

schema: omni_dbt_fhir
table_name: OBSERVATIONS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the observation
    primary_key: true

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the patient

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the encounter during which the observation was made

  code:
    sql: '"CODE"'
    #This description was pulled from dbt.
    description: Code representing the type of observation

  name:
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Name or description of the observation

  category:
    sql: '"CATEGORY"'
    #This description was pulled from dbt.
    description: Category of the observation e.g. vital-signs, laboratory

  value:
    sql: '"VALUE"'
    #This description was pulled from dbt.
    description: Numeric value of the observation

  unit:
    sql: '"UNIT"'
    #This description was pulled from dbt.
    description: Unit of measurement for the observation value

  effective_ts:
    sql: '"EFFECTIVE_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the observation was made or became effective

  issued_ts:
    sql: '"ISSUED_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the observation was issued or recorded

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Status of the observation (e.g., preliminary, final, amended)

  resource_raw:
    sql: '"RESOURCE_RAW"'
    #This description was pulled from dbt.
    description: Raw FHIR resource data for the observation

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: observations
  target_schema: DBT_CESTRADA_PROD
  description: Contains information about patient observations or measurements
  config:
    schema: fhir
    materialized: table
  code: |-
    select {{ dbt_utils.star(ref("stg_fhir__observations")) }}
    from {{ ref("int_fhir__observations") }}
