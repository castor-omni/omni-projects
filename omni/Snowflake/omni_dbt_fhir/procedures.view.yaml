# Reference this view as omni_dbt_fhir__procedures
schema_label: ""
#This description was pulled from dbt.
description: Contains information about medical procedures performed on patients

schema: omni_dbt_fhir
table_name: PROCEDURES

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the patient

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the condition related to the procedure

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the encounter during which the procedure was performed

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Status of the procedure (e.g., in-progress, completed, aborted)

  code:
    sql: '"CODE"'
    #This description was pulled from dbt.
    description: Code representing the procedure

  name:
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Name or description of the procedure

  reason_reference:
    sql: '"REASON_REFERENCE"'
    #This description was pulled from dbt.
    description: Reference to the reason for the procedure

  resource_raw:
    sql: '"RESOURCE_RAW"'
    #This description was pulled from dbt.
    description: Raw FHIR resource data for the procedure

  is_quick_procedure:
    sql: '"IS_QUICK_PROCEDURE"'
    #This description was pulled from dbt.
    description: Flag denoting true/false for quick procedures

  performed_start_ts:
    sql: '"PERFORMED_START_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the procedure started

  performed_end_ts:
    sql: '"PERFORMED_END_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the procedure ended

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: procedures
  target_schema: DBT_CESTRADA_PROD
  description: Contains information about medical procedures performed on patients
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('int_fhir__procedures')) }}
    from {{ ref('int_fhir__procedures') }}
