# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__medication_requests
#This description was pulled from dbt.
description: Contains information about medication requests or prescriptions

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: MEDICATION_REQUESTS

dimensions:
  authored_on:
    sql: '"AUTHORED_ON"'
    #This description was pulled from dbt.
    description: Date when the medication request was authored

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the patient

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the encounter associated with the medication request

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the condition being treated by the medication

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Status of the medication request (e.g., active, completed, stopped)

  dosage_instructions_as_needed:
    sql: '"DOSAGE_INSTRUCTIONS_AS_NEEDED"'
    #This description was pulled from dbt.
    description: Indicates if the medication is to be taken as needed

  resource_raw:
    sql: '"RESOURCE_RAW"'
    #This description was pulled from dbt.
    description: Raw FHIR resource data for the medication request

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: medication_requests
  target_schema: DBT_CESTRADA_PROD
  description: Contains information about medication requests or prescriptions
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_fhir__medication_requests')) }}
    from {{ ref('int_fhir__medication_requests') }}
