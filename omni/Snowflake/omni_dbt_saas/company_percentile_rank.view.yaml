# Reference this view as omni_dbt_saas__company_percentile_rank
schema_label: ""
#This description was pulled from dbt.
description: |
  Where each company ranks within a chosen peer group, in long form. GRAIN: one row per (account_id, snapshot_month, metric_id, peer_group_segment, peer_group_region, peer_group_product_tier). Each company-month-metric gets one row per peer-group combination (8 combos for 3 dimensions). The sentinel '__ALL__' means that dimension is rolled up. All 18 metrics are ranked via cume_dist(). Rate metrics that can be NULL (a company with no active users of a given type) are filtered out per metric before ranking, so a company is ranked only among peers WITH adoption of that metric — matching the NULL-excluding stats in benchmark_stats. Count metrics are never NULL (a genuine 0 ranks at the bottom).

schema: omni_dbt_saas
table_name: COMPANY_PERCENTILE_RANK

dimensions:
  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Company identifier.

  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'
    #This description was pulled from dbt.
    description: Month of the snapshot.

  metric_id:
    sql: '"METRIC_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Metric key. Foreign key to benchmark_metric.

  peer_group_segment:
    sql: '"PEER_GROUP_SEGMENT"'
    #This description was pulled from dbt.
    description: Segment the ranking peer group is restricted to, or '__ALL__'.

  peer_group_region:
    sql: '"PEER_GROUP_REGION"'
    #This description was pulled from dbt.
    description: Region the ranking peer group is restricted to, or '__ALL__'.

  peer_group_product_tier:
    sql: '"PEER_GROUP_PRODUCT_TIER"'
    #This description was pulled from dbt.
    description: Product tier the ranking peer group is restricted to, or '__ALL__'.

  percentile_rank:
    sql: '"PERCENTILE_RANK"'
    #This description was pulled from dbt.
    description: |
      Fraction of the peer group at or below this company's value (0–1, via cume_dist). Roughly 0.50 is the median; higher is a better rank for these event-count metrics. Note the lowest company in a peer group reads 1/n (never exactly 0); the highest reads 1.0.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: company_percentile_rank
  target_schema: DBT_CESTRADA_PROD
  description: |
    Where each company ranks within a chosen peer group, in long form. GRAIN: one row per (account_id, snapshot_month, metric_id, peer_group_segment, peer_group_region, peer_group_product_tier). Each company-month-metric gets one row per peer-group combination (8 combos for 3 dimensions). The sentinel '__ALL__' means that dimension is rolled up. All 18 metrics are ranked via cume_dist(). Rate metrics that can be NULL (a company with no active users of a given type) are filtered out per metric before ranking, so a company is ranked only among peers WITH adoption of that metric — matching the NULL-excluding stats in benchmark_stats. Count metrics are never NULL (a genuine 0 ranks at the bottom).
  config:
    schema: saas
    materialized: incremental
  code: |-
    -- models/02-mart/saas/company_percentile_rank.sql

    {{ config(materialized='incremental', unique_key=[
        'account_id','snapshot_month','metric_id',
        'peer_group_segment','peer_group_region','peer_group_product_tier'
    ]) }}

    {# All 18 metrics from benchmark_metric (same list as company_usage_metrics).      #}
    {# NULL handling: per-active-user-of-type rate metrics are NULL when a company     #}
    {# had no active users of that type that month. Each metric's select below filters #}
    {# `where <metric> is not null`, so cume_dist() ranks a company only among peers   #}
    {# WITH adoption of that metric — matching the NULL-excluding stats in             #}
    {# benchmark_stats. Count metrics are never NULL, so the filter is a no-op         #}
    {# for them (a genuine 0 still ranks at the bottom, as it should).                 #}
    {% set metrics = [
        'total_users', 'total_admin_users', 'total_creator_users', 'total_viewer_users',
        'total_events', 'total_agentic_events', 'total_api_events', 'total_ui_events', 'total_admin_other_events',
        'events_per_user', 'agentic_events_per_user', 'api_events_per_user', 'ui_events_per_user', 'admin_other_events_per_user',
        'admin_other_events_per_admin_user', 'agentic_events_per_creator_user', 'ui_events_per_creator_user', 'ui_events_per_viewer_user'
    ] %}

    {# Each cohort: (segment_expr, region_expr, product_tier_expr, partition_cols)        #}
    {# Sentinel '__ALL__' marks a dimension that is rolled up (not in the partition).     #}
    {% set cohorts = [
        ("'__ALL__'", "'__ALL__'", "'__ALL__'",  "snapshot_month"),
        ("segment",   "'__ALL__'", "'__ALL__'",  "snapshot_month, segment"),
        ("'__ALL__'", "region",    "'__ALL__'",  "snapshot_month, region"),
        ("'__ALL__'", "'__ALL__'", "product_tier","snapshot_month, product_tier"),
        ("segment",   "region",    "'__ALL__'",  "snapshot_month, segment, region"),
        ("segment",   "'__ALL__'", "product_tier","snapshot_month, segment, product_tier"),
        ("'__ALL__'", "region",    "product_tier","snapshot_month, region, product_tier"),
        ("segment",   "region",    "product_tier","snapshot_month, segment, region, product_tier")
    ] %}

    {# Flatten metric × cohort so we only rely on loop.last #}
    {% set combos = [] %}
    {% for m in metrics %}
        {% for seg_expr, reg_expr, tier_expr, partition_cols in cohorts %}
            {% do combos.append((m, seg_expr, reg_expr, tier_expr, partition_cols)) %}
        {% endfor %}
    {% endfor %}

    with src as (

        select
            account_id,
            snapshot_month,
            segment,
            region,
            product_tier,
            {% for m in metrics %}
            {{ m }}{% if not loop.last %},{% endif %}
            {% endfor %}

        from {{ ref('int_saas__company_usage') }}

        {% if is_incremental() %}
            where snapshot_month >= dateadd('month', -1, date_trunc('month', current_date))
        {% endif %}

    )

    {% for m, seg_expr, reg_expr, tier_expr, partition_cols in combos %}
    select
        account_id,
        snapshot_month,
        '{{ m }}'::varchar          as metric_id,
        {{ seg_expr }}::varchar     as peer_group_segment,
        {{ reg_expr }}::varchar     as peer_group_region,
        {{ tier_expr }}::varchar    as peer_group_product_tier,
        cume_dist() over (
            partition by {{ partition_cols }}
            order by {{ m }}
        )                           as percentile_rank
    from src
    where {{ m }} is not null
    {% if not loop.last %}union all{% endif %}
    {% endfor %}
