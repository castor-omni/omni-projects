# Reference this view as omni_dbt_fhir__int_fhir__patients
schema_label: ""

schema: omni_dbt_fhir
table_name: INT_FHIR__PATIENTS

dimensions:
  birth_date:
    sql: '"BIRTH_DATE"'

  deceased_ts:
    sql: '"DECEASED_TS"'

  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  family_name:
    sql: '"FAMILY_NAME"'

  given_names:
    sql: '"GIVEN_NAMES"'

  phone_number:
    sql: '"PHONE_NUMBER"'

  gender:
    sql: '"GENDER"'

  marital_status:
    sql: '"MARITAL_STATUS"'

  multiple_birth:
    sql: '"MULTIPLE_BIRTH"'

  city:
    sql: '"CITY"'

  country:
    sql: '"COUNTRY"'

  postal_code:
    sql: '"POSTAL_CODE"'

  state:
    sql: '"STATE"'

  address_line_1:
    sql: '"ADDRESS_LINE_1"'

  address_line_2:
    sql: '"ADDRESS_LINE_2"'

  latitude:
    sql: '"LATITUDE"'

  longitude:
    sql: '"LONGITUDE"'

  race:
    sql: '"RACE"'

  ethnicity:
    sql: '"ETHNICITY"'

  birth_sex:
    sql: '"BIRTH_SEX"'

  birth_place:
    sql: '"BIRTH_PLACE"'

  mothers_maiden_name:
    sql: '"MOTHERS_MAIDEN_NAME"'

  interpreter_required:
    sql: '"INTERPRETER_REQUIRED"'

  ssn:
    sql: '"SSN"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__patients
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
        timestampadd(year, extract(year, current_date()) - 2016, birth_date) as birth_date,
        timestampadd(year, extract(year, current_date()) - 2016, deceased_ts) as deceased_ts,
        {{ dbt_utils.star(ref("stg_fhir__patients"), except=["birth_date", "deceased_ts"]) }}
    from {{ ref('stg_fhir__patients') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, birth_date)
        < current_date()
  referenced_by: [ patients ]
