dimensions:
  formularyid:
    sql: '"FORMULARYID"'

  payer:
    sql: '"PAYER"'

  planname:
    sql: '"PLANNAME"'

  productid:
    sql: '"PRODUCTID"'

  marketid:
    sql: '"MARKETID"'

  coveragestatus:
    sql: '"COVERAGESTATUS"'

  formularytier:
    sql: '"FORMULARYTIER"'

  priorauthrequired:
    sql: '"PRIORAUTHREQUIRED"'

