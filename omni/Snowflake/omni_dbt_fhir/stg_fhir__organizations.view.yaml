# Reference this view as omni_dbt_fhir__stg_fhir__organizations
schema_label: ""

schema: omni_dbt_fhir
table_name: STG_FHIR__ORGANIZATIONS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  name:
    sql: '"NAME"'

  type:
    sql: '"TYPE"'

  profile:
    sql: '"PROFILE"'

  revenue:
    sql: '"REVENUE"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_fhir__organizations
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: view
  code: |-
    with raw as (
        select v.resource_raw
        from {{ source("fhir", "raw_fhir") }},
        lateral flatten(input => variant_col:entry) as f,
        lateral (select f.value:resource::variant as resource_raw) as v
        where lower(v.resource_raw:"resourceType"::varchar) = 'organization'
    )
    select
        resource_raw:"id"::varchar as id,
        resource_raw:"name"::varchar as name,
        resource_raw:"type"[0]."text"::varchar as type,
        resource_raw:"meta"."profile"[0]::varchar as profile,
        uniform(100000, 50000000, random()) as revenue,
        resource_raw
    from raw
  referenced_by: [ int_fhir__organizations, organizations ]
