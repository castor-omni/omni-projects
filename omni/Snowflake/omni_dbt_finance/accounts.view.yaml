# Reference this view as omni_dbt_finance__accounts
schema_label: ""
#This description was pulled from dbt.
description: Financial accounts that hold client assets and cash balances. Each
  account represents a specific investment vehicle or container for a client's
  holdings.

schema: omni_dbt_finance
table_name: ACCOUNTS

dimensions:
  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each financial account

  account_type:
    sql: '"ACCOUNT_TYPE"'
    #This description was pulled from dbt.
    description: Type of account

  account_status:
    sql: '"ACCOUNT_STATUS"'
    #This description was pulled from dbt.
    description: Current status of the account

  balance:
    sql: '"BALANCE"'
    #This description was pulled from dbt.
    description: Current total balance/value of the account in the account's base currency

  currency:
    sql: '"CURRENCY"'
    #This description was pulled from dbt.
    description: Base currency for the account

  open_date:
    sql: '"OPEN_DATE"'
    #This description was pulled from dbt.
    description: Date and time when the account was opened

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: accounts
  target_schema: DBT_CESTRADA_PROD
  description: Financial accounts that hold client assets and cash balances. Each
    account represents a specific investment vehicle or container for a client's
    holdings.
  config:
    schema: finance
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_asset_management__dim_accounts')) }}
    from {{ ref('stg_asset_management__dim_accounts') }}
