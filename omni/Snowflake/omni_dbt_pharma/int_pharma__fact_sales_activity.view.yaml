# Reference this view as omni_dbt_pharma__int_pharma__fact_sales_activity
schema_label: ""

schema: omni_dbt_pharma
table_name: INT_PHARMA__FACT_SALES_ACTIVITY

dimensions:
  salesactivityid:
    sql: '"SALESACTIVITYID"'

  salesrepid:
    sql: '"SALESREPID"'

  physicianid:
    sql: '"PHYSICIANID"'

  geographyid:
    sql: '"GEOGRAPHYID"'

  productid:
    sql: '"PRODUCTID"'

  activitytype:
    sql: '"ACTIVITYTYPE"'

  channelid:
    sql: '"CHANNELID"'

  activitydate:
    sql: '"ACTIVITYDATE"'

  durationminutes:
    sql: '"DURATIONMINUTES"'

  outcome:
    sql: '"OUTCOME"'

  notes:
    sql: '"NOTES"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_pharma__fact_sales_activity
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: pharma
    materialized: table
  code: |-
    with base as (
      select * from {{ ref('stg_pharma__fact_sales_activity') }}
    ), 

    anchor as (
      select max(ACTIVITYDATE) as anchor_date from base
    )
    select
      t.SALESACTIVITYID as SALESACTIVITYID,
      t.SALESREPID as SALESREPID,
      t.PHYSICIANID as PHYSICIANID,
      t.GEOGRAPHYID as GEOGRAPHYID,
      t.PRODUCTID as PRODUCTID,
      t.ACTIVITYTYPE as ACTIVITYTYPE,
      t.CHANNELID as CHANNELID,
      {{ pharma_shift_date('t.ACTIVITYDATE', 'anchor.anchor_date') }} as ACTIVITYDATE,
      t.DURATIONMINUTES as DURATIONMINUTES,
      t.OUTCOME as OUTCOME,
      t.NOTES as NOTES
    from base t
    cross join anchor
  referenced_by: [ fact_sales_activity ]
