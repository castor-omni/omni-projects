# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__stg_fhir__medications
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: STG_FHIR__MEDICATIONS

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  code:
    sql: '"CODE"'

  name:
    sql: '"NAME"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_fhir__medications
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: view
  code: |-
    with raw as (
        select 
            variant_col:"entry"[0]:"resource".id::varchar as patient_id,
            v.resource_raw
        from {{ source("fhir", "raw_fhir") }},
        lateral flatten(input => variant_col:entry) as f,
        lateral (select f.value:resource::variant as resource_raw) as v
        where lower(v.resource_raw:"resourceType"::varchar) = 'medication'
    )
    select
        patient_id,
        resource_raw:"code"."coding"[0]."code"::varchar as code,
        resource_raw:"code"."coding"[0]."display"::varchar as name,
        resource_raw
    from raw
  referenced_by: [ int_fhir__medications, medications ]
