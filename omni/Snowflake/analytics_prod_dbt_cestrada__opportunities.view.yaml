# Reference this view as analytics_prod_dbt_cestrada__opportunities
label: Opportunities
description: Salesforce sales opportunities (deals) from the DBT_CESTRADA
  schema, one row per opportunity, with pipeline stage, amounts (ARR/ACV/TCV),
  forecast category, and win/loss context.

dimensions:
  stage_name:
    description: "Pipeline stage: Pre-Qualified, Qualified, Trial, Trial Positive,
      Negotiate, Closed Won, Closed Lost"
    sample_values:
      [
        Pre-Qualified,
        Qualified,
        Trial,
        Trial Positive,
        Negotiate,
        Closed Won,
        Closed Lost
      ]
    synonyms: [ stage ]

  amount:
    format: usdcurrency_0
    description: Incremental ARR value of the deal
    synonyms: [ deal size, deal value, iarr ]

  arr:
    format: usdcurrency_0
    description: Annual recurring revenue on the deal

  acv:
    format: usdcurrency_0
    description: Annual contract value

  tcv:
    format: usdcurrency_0
    description: Total contract value across the contract term

  probability:
    format: number_0
    description: Likelihood of closing, 0-100

  type:
    description: "Opportunity type: New Business, Expansion, or Renewal"
    sample_values: [ New Business, Expansion, Renewal ]

  risk_score:
    format: number_0
    description: Model-scored risk of the deal not closing

  status:
    sql: CASE WHEN ${stage_name} IN ('Closed Won','Closed Lost') THEN 'Closed' ELSE
      'Open Pipeline' END
    description: Whether the deal is still in the pipeline (Open Pipeline) or Closed
    sample_values: [ Open Pipeline, Closed ]

  is_iqcc:
    sql: CASE WHEN ${type} = 'New Business' AND ${is_won} AND DATE_TRUNC('quarter',
      ${close_date}) = DATE_TRUNC('quarter', ${created_date}) THEN TRUE ELSE
      FALSE END
    label: Is IQCC
    description: "In-quarter create close: New Business closed won in the same
      quarter it was created"
    synonyms: [ iqcc, in quarter create close ]

  sales_cycle_days:
    sql: DATEDIFF('day', ${created_date}, ${close_date})
    format: number_0
    description: Days from opportunity creation to close date

  days_since_last_stage_change:
    sql: DATEDIFF('day', ${last_stage_change_date}, CURRENT_TIMESTAMP())
    format: number_0
    description: Days since the deal last moved stages; high values on open deals
      signal stalled deals

measures:
  count:
    label: Opportunities Count
    format: NUMBER_0

  amount_sum:
    sql: ${amount}
    label: Total Amount
    format: usdcurrency_0
    description: Sum of opportunity amount (iARR). Use this for total sales or revenue.
    aggregate_type: sum
    synonyms: [ revenue, sales, total revenue, iarr ]

  amount_sum_won:
    sql: ${amount}
    label: Won Amount
    format: usdcurrency_0
    description: Sum of amount for closed won deals
    aggregate_type: sum
    filters:
      stage_name:
        is: Closed Won

  amount_sum_open_pipeline:
    sql: ${amount}
    label: Open Pipeline Amount
    format: usdcurrency_0
    description: Sum of amount for deals not yet closed won or closed lost
    aggregate_type: sum
    filters:
      stage_name:
        not: [ Closed Won, Closed Lost ]

  weighted_pipeline_amount:
    sql: SUM(${amount} * ${probability} / 100)
    label: Weighted Pipeline Amount
    format: usdcurrency_0
    description: Open and closed amount weighted by probability, for forecasting

  arr_sum:
    sql: ${arr}
    label: Total ARR
    format: usdcurrency_0
    aggregate_type: sum

  won_opps_count:
    label: Won Opportunities
    description: Count of closed won opportunities
    aggregate_type: count
    filters:
      stage_name:
        is: Closed Won

  lost_opps_count:
    label: Lost Opportunities
    description: Count of closed lost opportunities
    aggregate_type: count
    filters:
      stage_name:
        is: Closed Lost

  conversion_rate:
    sql: ${won_opps_count} / NULLIF(${count}, 0)
    label: Win Rate
    format: percent_1
    description: Won opportunities divided by all opportunities in scope
    synonyms: [ win rate, close rate ]

  average_deal_size:
    sql: ${amount}
    label: Average Deal Size
    format: usdcurrency_0
    aggregate_type: average

  average_sales_cycle_days:
    sql: ${sales_cycle_days}
    label: Avg Sales Cycle (Days)
    format: number_1
    aggregate_type: average
