# Reference this view as analytics_prod_demo__zendesk_tickets
catalog: ANALYTICS_PROD
schema: DEMO
table_name: ZENDESK_TICKETS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

  ticket_id:
    sql: '"TICKET_ID"'
    format: ID

  type:
    sql: '"TYPE"'

  subject:
    sql: '"SUBJECT"'

  description:
    sql: '"DESCRIPTION"'

  priority:
    sql: '"PRIORITY"'

  status:
    sql: '"STATUS"'

  channel:
    sql: '"CHANNEL"'

  requester_id:
    sql: '"REQUESTER_ID"'
    format: ID

  assignee_id:
    sql: '"ASSIGNEE_ID"'
    format: ID

  group_id:
    sql: '"GROUP_ID"'
    format: ID

  created_date:
    sql: '"CREATED_DATE"'

  updated_date:
    sql: '"UPDATED_DATE"'

  resolved_date:
    sql: '"RESOLVED_DATE"'

  first_response_time_hours:
    sql: '"FIRST_RESPONSE_TIME_HOURS"'

  resolution_time_hours:
    sql: '"RESOLUTION_TIME_HOURS"'

  satisfaction_score:
    sql: '"SATISFACTION_SCORE"'

  satisfaction_comment:
    sql: '"SATISFACTION_COMMENT"'

  tags:
    sql: '"TAGS"'

  account_segment:
    sql: '"ACCOUNT_SEGMENT"'

  brand_id:
    sql: '"BRAND_ID"'
    format: ID

  locale:
    sql: '"LOCALE"'

  timezone:
    sql: '"TIMEZONE"'

  due_date:
    sql: '"DUE_DATE"'

  external_id:
    sql: '"EXTERNAL_ID"'
    format: ID

  jira_issue_id:
    sql: '"JIRA_ISSUE_ID"'
    format: ID

measures:
  count:
    aggregate_type: count

  open_tickets:
    label: Open Tickets
    description: Tickets not yet solved (status open or pending)
    aggregate_type: count
    filters:
      status:
        is: [ open, pending ]

  solved_tickets:
    label: Solved Tickets
    aggregate_type: count
    filters:
      status:
        is: solved

  average_first_response_hours:
    sql: ${first_response_time_hours}
    label: Avg First Response (Hours)
    format: number_1
    aggregate_type: average

  average_resolution_hours:
    sql: ${resolution_time_hours}
    label: Avg Resolution Time (Hours)
    format: number_1
    aggregate_type: average

  average_satisfaction_score:
    sql: ${satisfaction_score}
    label: Avg Satisfaction Score
    format: number_2
    aggregate_type: average
    synonyms: [ csat, satisfaction ]
