# Reference this view as analytics_dev_dbt_cestrada_prod_finance__assets
#This description was pulled from dbt.
description: Master reference table of all investable assets available in the
  system, including their current market information and classifications.

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FINANCE
table_name: ASSETS

dimensions:
  asset_id:
    sql: '"ASSET_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each asset

  asset_name:
    sql: '"ASSET_NAME"'
    #This description was pulled from dbt.
    description: Full name or description of the asset

  asset_type:
    sql: '"ASSET_TYPE"'
    #This description was pulled from dbt.
    description: Broad category of asset

  asset_class:
    sql: '"ASSET_CLASS"'
    #This description was pulled from dbt.
    description: Investment classification for portfolio allocation

  sector:
    sql: '"SECTOR"'
    #This description was pulled from dbt.
    description: Industry sector or category

  current_price:
    sql: '"CURRENT_PRICE"'
    #This description was pulled from dbt.
    description: Most recent market price per unit of the asset

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: assets
  target_schema: DBT_CESTRADA_PROD
  description: Master reference table of all investable assets available in the
    system, including their current market information and classifications.
  config:
    schema: finance
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_asset_management__dim_assets')) }}
    from {{ ref('stg_asset_management__dim_assets') }}
