# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__int_fhir__care_plans
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: INT_FHIR__CARE_PLANS

dimensions:
  start_ts:
    sql: '"START_TS"'

  end_ts:
    sql: '"END_TS"'

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  service_provider_id:
    sql: '"SERVICE_PROVIDER_ID"'
    format: ID

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  category:
    sql: '"CATEGORY"'

  activity:
    sql: '"ACTIVITY"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__care_plans
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      timestampadd(year, extract(year, current_date()) - 2016, start_ts) as start_ts,
      timestampadd(year, extract(year, current_date()) - 2016, end_ts) as end_ts,
      {{ dbt_utils.star(ref('stg_fhir__care_plans'), except=["start_ts", "end_ts"]) }}
    from {{ ref('stg_fhir__care_plans') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, start_ts)
        < current_date()
  referenced_by: [ care_plans ]
