# Reference this view as analytics_dev_dbt_cestrada_prod_saas__zendesk_tickets
#This description was pulled from dbt.
description: Table for customer support tickets

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_SAAS
table_name: ZENDESK_TICKETS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier of support ticket
    primary_key: true

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Account ID linked to support ticket

  ticket_id:
    sql: '"TICKET_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique Zendesk ticket id

  type:
    sql: '"TYPE"'
    #This description was pulled from dbt.
    description: Type of support issue

  subject:
    sql: '"SUBJECT"'
    #This description was pulled from dbt.
    description: Subject the support ticket is related to

  description:
    sql: '"DESCRIPTION"'
    #This description was pulled from dbt.
    description: Brief description of support ticket

  priority:
    sql: '"PRIORITY"'
    #This description was pulled from dbt.
    description: Priority set on support ticket

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Current status of support ticket

  channel:
    sql: '"CHANNEL"'
    #This description was pulled from dbt.
    description: Channel in which support ticket was submitted

  requester_id:
    sql: '"REQUESTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: ID of requester

  assignee_id:
    sql: '"ASSIGNEE_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Support team memeber assiged to ticket

  group_id:
    sql: '"GROUP_ID"'
    format: ID

  created_date:
    sql: '"CREATED_DATE"'
    #This description was pulled from dbt.
    description: Date which support ticket was created

  updated_date:
    sql: '"UPDATED_DATE"'
    #This description was pulled from dbt.
    description: Most recent ticket update date

  resolved_date:
    sql: '"RESOLVED_DATE"'
    #This description was pulled from dbt.
    description: Date of ticket resolution

  first_response_time_hours:
    sql: '"FIRST_RESPONSE_TIME_HOURS"'
    #This description was pulled from dbt.
    description: Time to first response on ticket

  resolution_time_hours:
    sql: '"RESOLUTION_TIME_HOURS"'
    #This description was pulled from dbt.
    description: Time to resolution of ticket

  satisfaction_score:
    sql: '"SATISFACTION_SCORE"'
    #This description was pulled from dbt.
    description: CSAT score of unique ticket

  satisfaction_comment:
    sql: '"SATISFACTION_COMMENT"'
    #This description was pulled from dbt.
    description: Comment associated with CSAT score

  tags:
    sql: '"TAGS"'
    #This description was pulled from dbt.
    description: Tags assigned to support ticket

  account_segment:
    sql: '"ACCOUNT_SEGMENT"'
    #This description was pulled from dbt.
    description: Account segment the support ticket belongs to

  brand_id:
    sql: '"BRAND_ID"'
    format: ID

  locale:
    sql: '"LOCALE"'

  timezone:
    sql: '"TIMEZONE"'
    #This description was pulled from dbt.
    description: Timezone of reported support ticket

  due_date:
    sql: '"DUE_DATE"'
    #This description was pulled from dbt.
    description: Due date for a support ticket

  external_id:
    sql: '"EXTERNAL_ID"'
    format: ID

  jira_issue_id:
    sql: '"JIRA_ISSUE_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Jira issue for a support ticket, if one

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
