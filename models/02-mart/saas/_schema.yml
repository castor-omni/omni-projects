      - name: account_id
        description: "Unique identifier for an account"
      - name: name
        description: "Opportunity name.  Should be account name + opportunity type"
      - name: stage_name
        description: "Current pipeline stage the opportunity is in"
      - name: amount
        description: "Contract amount for given opportunity"
      - name: probability
        description: "Probability that the given opportunity will be won"
      - name: close_date
        description: "Forecasted close date for the opportunity"
      - name: type
        description: "Type of opportunity.  New business, upsell/expansion, or renewal"
      - name: lead_source
        description: "Channel the opportunity was sourced from"
      - name: is_won
        description: "Boolean field to determine if the opportunity is won or not"
      - name: forecast_category
        description: "Sales manager's forecast category"
      - name: owner_id
        description: "ID of account executive who currently owns the account"
      - name: sales_engineer_id
        description: "ID of sales engineer who currently owns the account"
      - name: created_date
        description: "Date the opportunity was created"
      - name: contact_id
        description: "Identifier for main point of contact at the account"
      - name: last_stage_change_date
        description: "Date of last change in opportunity stage"
      - name: first_demo_date
        description: "Date of the first demo"
      - name: trial_start_date
        description: "Date of the trial start day"
      - name: competitor
        description: "Competitors in the sales process"
      - name: loss_reason
        description: "Reason for opportunity not winning"
      - name: segment
        description: "Account segment of the opportunity"

  - name: opportunity_history
