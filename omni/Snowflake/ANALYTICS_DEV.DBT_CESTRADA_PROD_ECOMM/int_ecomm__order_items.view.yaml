# Reference this view as analytics_dev_dbt_cestrada_prod_ecomm__int_ecomm__order_items
#This description was pulled from dbt.
description: Intermediate table containing detailed order item information

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_ECOMM
table_name: INT_ECOMM__ORDER_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each order item
    primary_key: true

  order_id:
    sql: '"ORDER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the order

  user_id:
    sql: '"USER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the user who placed the order

  inventory_item_id:
    sql: '"INVENTORY_ITEM_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the inventory item in the order

  sale_price:
    sql: '"SALE_PRICE"'
    #This description was pulled from dbt.
    description: Price at which the item was sold

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Current status of the order item

  created_at:
    sql: '"CREATED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the order item was created

  returned_at:
    sql: '"RETURNED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the order item was returned (if applicable)

  shipped_at:
    sql: '"SHIPPED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the order item was shipped

  delivered_at:
    sql: '"DELIVERED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the order item was delivered

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_ecomm__order_items
  target_schema: DBT_CESTRADA_PROD
  description: Intermediate table containing detailed order item information
  config:
    schema: ecomm
    materialized: table
  code: |-
    with
        order_items_modified as (
            select
                id,
                order_id,
                user_id,
                inventory_item_id,
                sale_price,
                status,
                created_at,
                case
                    when returned_at is null
                    then null
                    else
                        date_trunc(
                            'DAY',
                            timestampadd(
                                days,
                                case
                                    when mod(order_id, 1000) < 97
                                    then 3
                                    when mod(order_id, 1000) < 201
                                    then 4
                                    when mod(order_id, 1000) < 306
                                    then 5
                                    when mod(order_id, 1000) < 418
                                    then 6
                                    when mod(order_id, 1000) < 509
                                    then 7
                                    when mod(order_id, 1000) < 583
                                    then 8
                                    when mod(order_id, 1000) < 676
                                    then 9
                                    when mod(order_id, 1000) < 753
                                    then 10
                                    when mod(order_id, 1000) < 821
                                    then 11
                                    when mod(order_id, 1000) < 879
                                    then 12
                                    when mod(order_id, 1000) < 933
                                    then 13
                                    when mod(order_id, 1000) < 947
                                    then 14
                                    when mod(order_id, 1000) < 964
                                    then 15
                                    when mod(order_id, 1000) < 973
                                    then 16
                                    when mod(order_id, 1000) < 979
                                    then 17
                                    when mod(order_id, 1000) < 947
                                    then 18
                                    when mod(order_id, 1000) < 959
                                    then 19
                                    when mod(order_id, 1000) < 966
                                    then 20
                                    when mod(order_id, 1000) < 971
                                    then 21
                                    when mod(order_id, 1000) < 975
                                    then 22
                                    when mod(order_id, 1000) < 979
                                    then 23
                                    when mod(order_id, 1000) < 982
                                    then 24
                                    when mod(order_id, 1000) < 985
                                    then 25
                                    when mod(order_id, 1000) < 988
                                    then 26
                                    when mod(order_id, 1000) < 991
                                    then 27
                                    when mod(order_id, 1000) < 993
                                    then 28
                                    when mod(order_id, 1000) < 995
                                    then 29
                                    when mod(order_id, 1000) < 997
                                    then 30
                                    when mod(order_id, 1000) < 998
                                    then 31
                                    else 32
                                end,
                                created_at
                            )
                        )
                end as returned_at,
                shipped_at,
                delivered_at
            from {{ ref('stg_ecomm__order_items') }}
        )

    select
        id,
        order_id,
        user_id,
        inventory_item_id,
        sale_price,
        case
            when status = 'Cancelled'
            then status
            else  -- we don't have a cancelled timestamp, so just use this one
                case
                    when
                        timestampadd(year, extract(year, current_date()) - 2022, shipped_at)
                        > current_date()
                    then 'Processing'
                    else  -- it was shipped, but after today, so mark it as processing
                        case
                            when
                                timestampadd(
                                    year, extract(year, current_date()) - 2022, delivered_at
                                )
                                > current_date()
                            then 'Shipped'
                            else  -- it was delivered after today, so mark it as shipped
                                case
                                    when
                                        timestampadd(
                                            year,
                                            extract(year, current_date()) - 2022,
                                            returned_at
                                        )
                                        > current_date()
                                    then 'Complete'
                                    else status
                                end  -- it was returned, but after today, so mark it as delievered
                        end
                end
        end as status,
        timestampadd(year, extract(year, current_date()) - 2022, created_at) as created_at,
        case
            when
                timestampadd(year, extract(year, current_date()) - 2022, returned_at)
                > current_date()
                or timestampadd(year, extract(year, current_date()) - 2022, shipped_at)
                > current_date()
                or timestampadd(year, extract(year, current_date()) - 2022, delivered_at)
                > current_date()
            then null
            else timestampadd(year, extract(year, current_date()) - 2022, returned_at)
        end as returned_at,
        case
            when
                timestampadd(year, extract(year, current_date()) - 2022, shipped_at)
                > current_date()
            then null
            else timestampadd(year, extract(year, current_date()) - 2022, shipped_at)
        end as shipped_at,
        case
            when
                timestampadd(year, extract(year, current_date()) - 2022, delivered_at)
                > current_date()
                or timestampadd(year, extract(year, current_date()) - 2022, shipped_at)
                > current_date()
            then null
            else timestampadd(year, extract(year, current_date()) - 2022, delivered_at)
        end as delivered_at
    from order_items_modified
    where
        1 = 1
        and timestampadd(year, extract(year, current_date()) - 2022, created_at)
        < current_date()
  referenced_by: [ order_items, shipped_order_items ]
