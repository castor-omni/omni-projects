# Reference this view as omni_dbt_fhir__int_fhir__medication_requests
schema_label: ""

schema: omni_dbt_fhir
table_name: INT_FHIR__MEDICATION_REQUESTS

dimensions:
  authored_on:
    sql: '"AUTHORED_ON"'

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  dosage_instructions_as_needed:
    sql: '"DOSAGE_INSTRUCTIONS_AS_NEEDED"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__medication_requests
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
        timestampadd(year, extract(year, current_date()) - 2016, authored_on) as authored_on,
        {{ dbt_utils.star(ref("stg_fhir__medication_requests"), except=["authored_on"]) }}
    from {{ ref('stg_fhir__medication_requests') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, authored_on)
        < current_date()
  referenced_by: [ medication_requests ]
