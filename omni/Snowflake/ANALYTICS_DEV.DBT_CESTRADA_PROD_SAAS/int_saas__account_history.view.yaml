# Reference this view as analytics_dev_dbt_cestrada_prod_saas__int_saas__account_history
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_SAAS
table_name: INT_SAAS__ACCOUNT_HISTORY

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

  type:
    sql: '"TYPE"'

  status:
    sql: '"STATUS"'

  industry:
    sql: '"INDUSTRY"'

  annual_revenue:
    sql: '"ANNUAL_REVENUE"'

  number_of_employees:
    sql: '"NUMBER_OF_EMPLOYEES"'

  segment:
    sql: '"SEGMENT"'

  owner_id:
    sql: '"OWNER_ID"'
    format: ID

  csm_id:
    sql: '"CSM_ID"'
    format: ID

  created_date:
    sql: '"CREATED_DATE"'

  last_modified_date:
    sql: '"LAST_MODIFIED_DATE"'

  churn_date:
    sql: '"CHURN_DATE"'

  churn_reason:
    sql: '"CHURN_REASON"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_saas__account_history
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: saas
    materialized: table
  code: |-
    WITH PARAMS AS (
      SELECT 
        CURRENT_DATE() AS AS_OF_DATE,
        -- Dynamic offset: moves 2025 data to 2026
        (YEAR(CURRENT_DATE()) - 2025) AS YEAR_OFFSET 
    )

    SELECT
      -- Identifiers
      ID,
      ACCOUNT_ID,
      
      -- Account Attributes
      TYPE,
      STATUS,
      INDUSTRY,
      ANNUAL_REVENUE,
      NUMBER_OF_EMPLOYEES,
      SEGMENT,
      OWNER_ID,
      CSM_ID,

      -- THE SHIFTED TIMELINE
      -- 1. When this specific snapshot record was created
      DATEADD(MONTH, P.YEAR_OFFSET * 12, CREATED_DATE) AS CREATED_DATE,

      -- 2. When the account was last modified at the time of this record
      DATEADD(MONTH, P.YEAR_OFFSET * 12, LAST_MODIFIED_DATE) AS LAST_MODIFIED_DATE,

      -- 3. Churn Date logic
      -- If shifted churn is in the future, the account hasn't churned yet (NULL)
      IFF(
        DATEADD(MONTH, P.YEAR_OFFSET * 12, CHURN_DATE) > P.AS_OF_DATE,
        NULL,
        DATEADD(MONTH, P.YEAR_OFFSET * 12, CHURN_DATE)
      ) AS CHURN_DATE,

      CHURN_REASON

    FROM {{ ref("stg_saas__account_history") }}
    CROSS JOIN PARAMS P
    WHERE 
      -- Snapshot must have been created by today in our 2026 timeline
      DATEADD(MONTH, P.YEAR_OFFSET * 12, CREATED_DATE) <= P.AS_OF_DATE 
      AND (
        -- AND the modification must have logically happened by today
        LAST_MODIFIED_DATE IS NULL 
        OR DATEADD(MONTH, P.YEAR_OFFSET * 12, LAST_MODIFIED_DATE) <= P.AS_OF_DATE
      )
    ORDER BY ID ASC, CREATED_DATE DESC
