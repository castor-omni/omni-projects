# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__int_fhir__procedures
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: INT_FHIR__PROCEDURES

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  code:
    sql: '"CODE"'

  name:
    sql: '"NAME"'

  reason_reference:
    sql: '"REASON_REFERENCE"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

  is_quick_procedure:
    sql: '"IS_QUICK_PROCEDURE"'

  performed_start_ts:
    sql: '"PERFORMED_START_TS"'

  performed_end_ts:
    sql: '"PERFORMED_END_TS"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__procedures
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
        {{
            dbt_utils.star(
                from=ref("stg_fhir__procedures"),
                except=["performed_ts", "performed_start_ts", "performed_end_ts"],
            )
        }},
        case when performed_ts is not null then true else false end as is_quick_procedure,
        timestampadd(year, extract(year, current_date()) - 2016, coalesce(performed_ts, performed_start_ts)) as performed_start_ts,
        timestampadd(year, extract(year, current_date()) - 2016, coalesce(performed_ts, performed_end_ts)) as performed_end_ts
    from {{ ref("stg_fhir__procedures") }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, performed_start_ts)
        < current_date()
  referenced_by: [ procedures ]
