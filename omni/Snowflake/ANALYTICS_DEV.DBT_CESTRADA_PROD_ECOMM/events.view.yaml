# Reference this view as analytics_dev_dbt_cestrada_prod_ecomm__events
#This description was pulled from dbt.
description: Dimension table capturing various events related to user
  interactions on the ecommerce platform

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_ECOMM
table_name: EVENTS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each event
    primary_key: true

  sequence_number:
    sql: '"SEQUENCE_NUMBER"'
    #This description was pulled from dbt.
    description: Order of events within a session

  session_id:
    sql: '"SESSION_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the user session

  created_at:
    sql: '"CREATED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the event occurred

  ip_address:
    sql: '"IP_ADDRESS"'
    #This description was pulled from dbt.
    description: IP address of the user

  city:
    sql: '"CITY"'
    #This description was pulled from dbt.
    description: City where the event originated

  state:
    sql: '"STATE"'
    #This description was pulled from dbt.
    description: State where the event originated

  country:
    sql: '"COUNTRY"'
    #This description was pulled from dbt.
    description: Country where the event originated

  zip:
    sql: '"ZIP"'
    #This description was pulled from dbt.
    description: ZIP code where the event originated

  latitude:
    sql: '"LATITUDE"'
    #This description was pulled from dbt.
    description: Geographical latitude of the event location

  longitude:
    sql: '"LONGITUDE"'
    #This description was pulled from dbt.
    description: Geographical longitude of the event location

  os:
    sql: '"OS"'
    #This description was pulled from dbt.
    description: Operating system of the user's device

  browser:
    sql: '"BROWSER"'
    #This description was pulled from dbt.
    description: Web browser used by the user

  traffic_source:
    sql: '"TRAFFIC_SOURCE"'
    #This description was pulled from dbt.
    description: Source of the traffic (e.g., organic, paid)

  user_id:
    sql: '"USER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the user who triggered the event

  uri:
    sql: '"URI"'
    #This description was pulled from dbt.
    description: URI of the page where the event occurred

  event_type:
    sql: '"EVENT_TYPE"'
    #This description was pulled from dbt.
    description: Type of event (e.g., view, add to cart, purchase)

  ad_event_id:
    sql: '"AD_EVENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for advertising-related events

  referrer_code:
    sql: '"REFERRER_CODE"'
    #This description was pulled from dbt.
    description: Code identifying the referrer of the event

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: events
  target_schema: DBT_CESTRADA_PROD
  description: Dimension table capturing various events related to user
    interactions on the ecommerce platform
  config:
    schema: ecomm
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('int_ecomm__events')) }}
    from {{ ref('int_ecomm__events') }}
