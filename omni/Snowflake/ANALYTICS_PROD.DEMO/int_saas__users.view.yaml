# Reference this view as analytics_prod_demo__int_saas__users
label: Sales Rep

catalog: ANALYTICS_PROD
schema: DEMO
table_name: INT_SAAS__USERS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  first_name:
    sql: '"FIRST_NAME"'

  last_name:
    sql: '"LAST_NAME"'

  email:
    sql: '"EMAIL"'

  role:
    sql: '"ROLE"'

  region:
    sql: '"REGION"'

  segment:
    sql: '"SEGMENT"'

  manager_id:
    sql: '"MANAGER_ID"'
    format: ID

  se_id:
    sql: '"SE_ID"'
    format: ID

  quota_target:
    sql: '"QUOTA_TARGET"'

  quota_2024:
    sql: '"QUOTA_2024"'

  quota_2025:
    sql: '"QUOTA_2025"'

  quota_2026:
    sql: '"QUOTA_2026"'

  quota_attainment_pct:
    sql: '"QUOTA_ATTAINMENT_PCT"'

  performance_tier:
    sql: '"PERFORMANCE_TIER"'

  created_date:
    sql: '"CREATED_DATE"'

  ramp_end_date:
    sql: '"RAMP_END_DATE"'

  name:
    sql: CONCAT(${first_name}, ' ', ${last_name})
    label: Name
    description: Full name of the sales rep (first and last name)
    display_order: 1
    synonyms: [ rep, sales rep, owner, account executive ]

measures:
  count:
    aggregate_type: count
