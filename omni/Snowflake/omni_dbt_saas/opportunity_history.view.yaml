# Reference this view as omni_dbt_saas__opportunity_history
schema_label: ""
#This description was pulled from dbt.
description: Historical record of sales opportunities including stage changes,
  amounts, and win/loss tracking

schema: omni_dbt_saas
table_name: OPPORTUNITY_HISTORY

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each opportunity history record
    primary_key: true

  opportunity_id:
    sql: '"OPPORTUNITY_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the opportunity entity

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the associated account

  name:
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Name or title of the opportunity

  stage_name:
    sql: '"STAGE_NAME"'
    #This description was pulled from dbt.
    description: Current sales stage of the opportunity

  amount:
    sql: '"AMOUNT"'
    #This description was pulled from dbt.
    description: Total value of the opportunity in dollars

  arr:
    sql: '"ARR"'

  acv:
    sql: '"ACV"'

  tcv:
    sql: '"TCV"'

  contract_term_months:
    sql: '"CONTRACT_TERM_MONTHS"'

  probability:
    sql: '"PROBABILITY"'
    #This description was pulled from dbt.
    description: Probability of winning the opportunity (percentage)

  close_date:
    sql: '"CLOSE_DATE"'
    #This description was pulled from dbt.
    description: Expected or actual close date of the opportunity

  type:
    sql: '"TYPE"'
    #This description was pulled from dbt.
    description: Type of opportunity (new business, renewal, upsell, etc.)

  next_steps:
    sql: '"NEXT_STEPS"'
    #This description was pulled from dbt.
    description: Next actions to be taken for this opportunity

  lead_source:
    sql: '"LEAD_SOURCE"'
    #This description was pulled from dbt.
    description: Original source of the lead that created this opportunity

  is_won:
    sql: '"IS_WON"'
    #This description was pulled from dbt.
    description: Boolean flag indicating if the opportunity was won

  forecast_category:
    sql: '"FORECAST_CATEGORY"'
    #This description was pulled from dbt.
    description: Forecast category for pipeline reporting

  owner_id:
    sql: '"OWNER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: ID of the opportunity owner (sales rep)

  sales_engineer_id:
    sql: '"SALES_ENGINEER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: ID of the assigned sales engineer

  created_date:
    sql: '"CREATED_DATE"'
    #This description was pulled from dbt.
    description: Date when the opportunity was initially created

  contact_id:
    sql: '"CONTACT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Primary contact associated with this opportunity

  last_stage_change_date:
    sql: '"LAST_STAGE_CHANGE_DATE"'
    #This description was pulled from dbt.
    description: Date of the most recent stage change

  first_demo_date:
    sql: '"FIRST_DEMO_DATE"'
    #This description was pulled from dbt.
    description: Date when the first product demo was conducted

  trial_start_date:
    sql: '"TRIAL_START_DATE"'
    #This description was pulled from dbt.
    description: Date when the product trial began

  competitor:
    sql: '"COMPETITOR"'
    #This description was pulled from dbt.
    description: Primary competitor for this opportunity

  loss_reason:
    sql: '"LOSS_REASON"'
    #This description was pulled from dbt.
    description: Reason for losing the opportunity (if applicable)

  win_reason:
    sql: '"WIN_REASON"'

  risk_score:
    sql: '"RISK_SCORE"'

  risk_flags:
    sql: '"RISK_FLAGS"'

  identified_pain:
    sql: '"IDENTIFIED_PAIN"'

  ae_notes:
    sql: '"AE_NOTES"'

  segment:
    sql: '"SEGMENT"'

  risk_details:
    sql: '"RISK_DETAILS"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: opportunity_history
  target_schema: DBT_CESTRADA_PROD
  description: Historical record of sales opportunities including stage changes,
    amounts, and win/loss tracking
  config:
    schema: saas
    materialized: table
  code: |-
    select * from {{ ref('stg_saas__opportunity_history') }}
    WHERE CREATED_DATE <= current_date
