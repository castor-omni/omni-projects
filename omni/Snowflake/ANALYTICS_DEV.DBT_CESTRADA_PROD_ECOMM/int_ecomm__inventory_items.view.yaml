# Reference this view as analytics_dev_dbt_cestrada_prod_ecomm__int_ecomm__inventory_items
#This description was pulled from dbt.
description: Intermediate table containing detailed inventory item information

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_ECOMM
table_name: INT_ECOMM__INVENTORY_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each inventory item
    primary_key: true

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the associated product

  created_at:
    sql: '"CREATED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the inventory item was created

  sold_at:
    sql: '"SOLD_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the item was sold

  cost:
    sql: '"COST"'
    #This description was pulled from dbt.
    description: Cost of the inventory item

  product_category:
    sql: '"PRODUCT_CATEGORY"'
    #This description was pulled from dbt.
    description: Category of the product

  product_name:
    sql: '"PRODUCT_NAME"'
    #This description was pulled from dbt.
    description: Name of the product

  product_brand:
    sql: '"PRODUCT_BRAND"'
    #This description was pulled from dbt.
    description: Brand of the product

  product_retail_price:
    sql: '"PRODUCT_RETAIL_PRICE"'
    #This description was pulled from dbt.
    description: Retail price of the product

  product_department:
    sql: '"PRODUCT_DEPARTMENT"'
    #This description was pulled from dbt.
    description: Department the product belongs to

  product_sku:
    sql: '"PRODUCT_SKU"'
    #This description was pulled from dbt.
    description: Stock Keeping Unit of the product

  product_distribution_center_id:
    sql: '"PRODUCT_DISTRIBUTION_CENTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the distribution center for the product

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_ecomm__inventory_items
  target_schema: DBT_CESTRADA_PROD
  description: Intermediate table containing detailed inventory item information
  config:
    schema: ecomm
    materialized: table
  code: |-
    select
        id,
        product_id,
        timestampadd(year, extract(year, current_date()) - 2022, created_at) as created_at,
        case
            when
                timestampadd(year, extract(year, current_date()) - 2022, sold_at)
                > current_timestamp()
            then null
            else timestampadd(year, extract(year, current_date()) - 2022, sold_at)
        end as sold_at,
        cost,
        product_category,
        product_name,
        product_brand,
        product_retail_price,
        product_department,
        product_sku,
        product_distribution_center_id
    from {{ ref("stg_ecomm__inventory_items") }}
    where
        1 = 1
        and timestampadd(year, extract(year, current_date()) - 2022, created_at)
        < current_date()
  referenced_by: [ inventory_items, order_items, shipped_order_items ]
