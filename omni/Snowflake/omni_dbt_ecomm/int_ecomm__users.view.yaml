    #This description was pulled from dbt.
    description: Source of traffic that led to user signup

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_ecomm__users
  target_schema: DBT_CESTRADA_PROD
  description: Intermediate table containing detailed user information for
    ecommerce platform
  config:
    schema: ecomm
    materialized: table
  code: |-
    select
        id,
        first_name,
        last_name,
        email,
        case
            when age < 17
            then age + 1 + mod(id, 89)
            when age < 34
            then age + mod(id, 5)
            when age < 77
            then age - mod(id, 18)
            else age - mod(id, 12)
        end as age,
        city,
        state,
        country,
        zip,
        latitude,
        longitude,
        gender,
        timestampadd(year, extract(year, current_date()) - 2022, created_at) as created_at,
        traffic_source
    from {{ ref("stg_ecomm__users") }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2022, created_at)
        < current_date()
  referenced_by: [ order_items, sessions, shipped_order_items, users ]
