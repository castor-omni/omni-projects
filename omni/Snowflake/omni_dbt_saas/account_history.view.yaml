# Reference this view as omni_dbt_saas__account_history
schema_label: ""
#This description was pulled from dbt.
description: Historical records for the Salesforce accounts of Data Blobby

schema: omni_dbt_saas
table_name: ACCOUNT_HISTORY

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each account history record
    primary_key: true

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Foreign key reference to the account entity

  type:
    sql: '"TYPE"'
    #This description was pulled from dbt.
    description: Type or category of the account

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Current status of the account

  industry:
    sql: '"INDUSTRY"'
    #This description was pulled from dbt.
    description: Industry sector of the account

  annual_revenue:
    sql: '"ANNUAL_REVENUE"'
    #This description was pulled from dbt.
    description: Annual revenue of the account in dollars

  number_of_employees:
    sql: '"NUMBER_OF_EMPLOYEES"'
    #This description was pulled from dbt.
    description: Total number of employees in the account organization

  segment:
    sql: '"SEGMENT"'
    #This description was pulled from dbt.
    description: Market segment classification for the account

  owner_id:
    sql: '"OWNER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: ID of the account owner or manager

  created_date:
    sql: '"CREATED_DATE"'
    #This description was pulled from dbt.
    description: Date when the account was initially created

  last_modified_date:
    sql: '"LAST_MODIFIED_DATE"'
    #This description was pulled from dbt.
    description: Date of the most recent modification to the account

  churn_date:
    sql: '"CHURN_DATE"'
    #This description was pulled from dbt.
    description: Date when the account churned (if applicable)

  churn_reason:
    sql: '"CHURN_REASON"'
    #This description was pulled from dbt.
    description: Reason for account churn (if applicable)

  csm_id:
    sql: '"CSM_ID"'
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: account_history
  target_schema: DBT_CESTRADA_PROD
  description: Historical records for the Salesforce accounts of Data Blobby
  config:
    schema: saas
    materialized: table
  code: |-
    select * from {{ ref('stg_saas__account_history')}}
    WHERE LAST_MODIFIED_DATE <= current_date
