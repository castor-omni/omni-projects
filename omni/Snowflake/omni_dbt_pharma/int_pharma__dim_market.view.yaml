# Reference this view as omni_dbt_pharma__int_pharma__dim_market
schema_label: ""

schema: omni_dbt_pharma
table_name: INT_PHARMA__DIM_MARKET

dimensions:
  marketid:
    sql: '"MARKETID"'

  marketname:
    sql: '"MARKETNAME"'

  therapeuticarea:
    sql: '"THERAPEUTICAREA"'

  primarycompetitors:
    sql: '"PRIMARYCOMPETITORS"'

  launchyear:
    sql: '"LAUNCHYEAR"'

  marketsizeusd:
    sql: '"MARKETSIZEUSD"'

  lifecyclestage:
    sql: '"LIFECYCLESTAGE"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_pharma__dim_market
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: pharma
    materialized: table
  code: |-
    with base as (
      select * from {{ ref('stg_pharma__dim_market') }}
    ),

    anchor as (
      select coalesce(max(LAUNCHYEAR), extract(year from current_date())) as max_launch_year
      from base
    )
    select
      t.MARKETID as MARKETID,
      t.MARKETNAME as MARKETNAME,
      t.THERAPEUTICAREA as THERAPEUTICAREA,
      t.PRIMARYCOMPETITORS as PRIMARYCOMPETITORS,
      (t.LAUNCHYEAR + (extract(year from current_date()) - anchor.max_launch_year)) as LAUNCHYEAR,
      t.MARKETSIZEUSD as MARKETSIZEUSD,
      t.LIFECYCLESTAGE as LIFECYCLESTAGE
    from base t
    cross join anchor
