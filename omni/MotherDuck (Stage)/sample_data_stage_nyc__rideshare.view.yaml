# Reference this view as sample_data_stage_nyc__rideshare
measures:
  trip_miles_sum:
    sql: ${sample_data_stage_nyc__rideshare.trip_miles}
    description: "(Sum) Trip Miles: Distance traveled during a completed rideshare
      trip, measured in miles, used to calculate fares, driver earnings, and
      operational metrics like trip length and routing efficiency."
    aggregate_type: sum

  tolls_sum:
    sql: ${sample_data_stage_nyc__rideshare.tolls}
    description: "(Sum) Tolls: Total toll charges paid during the ride, representing
      the monetary cost of tolls incurred between pickup and dropoff."
    aggregate_type: sum
