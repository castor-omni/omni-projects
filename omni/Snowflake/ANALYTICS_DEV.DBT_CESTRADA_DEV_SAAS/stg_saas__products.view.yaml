# Reference this view as analytics_dev_dbt_cestrada_dev_saas__stg_saas__products
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_DEV_SAAS
table_name: STG_SAAS__PRODUCTS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  name:
    sql: '"NAME"'

  family:
    sql: '"FAMILY"'

  created_date:
    sql: '"CREATED_DATE"'

  product_code:
    sql: '"PRODUCT_CODE"'

measures:
  count:
    aggregate_type: count
