# Reference this view as omni_dbt_saas__benchmark_stats
schema_label: ""
#This description was pulled from dbt.
description: |
  Peer-group distribution statistics in long form. GRAIN: one row per (snapshot_month, peer_group_segment, peer_group_region, peer_group_product_tier, metric_id, statistic). Contains NO company-level rows or identifiers — safe to expose across tenants. The sentinel '__ALL__' in a peer_group_* column means that dimension is rolled up (not restricted). Pair with a company's own value to produce "my company vs. peer distribution" comparisons.

schema: omni_dbt_saas
table_name: BENCHMARK_STATS

dimensions:
  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'
    #This description was pulled from dbt.
    description: Month of the snapshot.

  peer_group_segment:
    sql: '"PEER_GROUP_SEGMENT"'
    #This description was pulled from dbt.
    description: Segment the peer group is restricted to, or '__ALL__' if not restricted.

  peer_group_region:
    sql: '"PEER_GROUP_REGION"'
    #This description was pulled from dbt.
    description: Region the peer group is restricted to, or '__ALL__' if not restricted.

  peer_group_product_tier:
    sql: '"PEER_GROUP_PRODUCT_TIER"'
    #This description was pulled from dbt.
    description: Product tier the peer group is restricted to, or '__ALL__' if not
      restricted.

  metric_id:
    sql: '"METRIC_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Metric key. Foreign key to benchmark_metric.

  statistic:
    sql: '"STATISTIC"'
    #This description was pulled from dbt.
    description: "Which distribution statistic this row holds: mean, p25, p50
      (median), p75, or p90."
    all_values: [ mean, p25, p50, p75, p90 ]

  value:
    sql: '"VALUE"'
    #This description was pulled from dbt.
    description: |
      The statistic's value for this peer group and metric. Nullable: rate metrics yield NULL stats for peer groups with no adopters of the relevant user type (AVG / PERCENTILE_CONT ignore NULL inputs).

  company_count:
    sql: '"COMPANY_COUNT"'
    #This description was pulled from dbt.
    description: |
      Number of companies in this peer group for this month. Use to suppress thin cohorts (k-anonymity). No suppression is applied in the model itself — enforce a minimum before exposing to customers.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: benchmark_stats
  target_schema: DBT_CESTRADA_PROD
  description: |
    Peer-group distribution statistics in long form. GRAIN: one row per (snapshot_month, peer_group_segment, peer_group_region, peer_group_product_tier, metric_id, statistic). Contains NO company-level rows or identifiers — safe to expose across tenants. The sentinel '__ALL__' in a peer_group_* column means that dimension is rolled up (not restricted). Pair with a company's own value to produce "my company vs. peer distribution" comparisons.
  config:
    schema: saas
    materialized: incremental
  code: |-
    -- models/02-mart/saas/benchmark_stats.sql

    {{ config(materialized='incremental', unique_key=[
        'snapshot_month','peer_group_segment','peer_group_region','peer_group_product_tier','metric_id','statistic'
    ]) }}

    {# (canonical metric_id, suffix as it appears in usage_benchmarks) #}
    {% set metrics = [
        ('total_users',                       'total_users'),
        ('total_admin_users',                 'admin_users'),
        ('total_creator_users',               'creator_users'),
        ('total_viewer_users',                'viewer_users'),
        ('total_events',                      'total_events'),
        ('total_agentic_events',              'agentic_events'),
        ('total_api_events',                  'api_events'),
        ('total_ui_events',                   'ui_events'),
        ('total_admin_other_events',          'admin_other_events'),
        ('events_per_user',                   'events_per_user'),
        ('agentic_events_per_user',           'agentic_events_per_user'),
        ('api_events_per_user',               'api_events_per_user'),
        ('ui_events_per_user',                'ui_events_per_user'),
        ('admin_other_events_per_user',       'admin_other_events_per_user'),
        ('admin_other_events_per_admin_user', 'admin_other_events_per_admin_user'),
        ('agentic_events_per_creator_user',   'agentic_events_per_creator_user'),
        ('ui_events_per_creator_user',        'ui_events_per_creator_user'),
        ('ui_events_per_viewer_user',         'ui_events_per_viewer_user')
    ] %}

    {# (canonical statistic, column prefix as it appears in usage_benchmarks) #}
    {% set statistics = [
        ('mean',   'mean'),
        ('p25',    'p25'),
        ('p50',    'median'),
        ('p75',    'p75'),
        ('p90',    'p90')
    ] %}

    {% set pairs = [] %}
    {% for metric_id, bench_suffix in metrics %}
        {% for stat_id, stat_prefix in statistics %}
            {% do pairs.append((metric_id, bench_suffix, stat_id, stat_prefix)) %}
        {% endfor %}
    {% endfor %}

    with src as (
        select * from {{ ref('int_saas__usage_benchmarks') }}

        {% if is_incremental() %}
            where snapshot_month >= dateadd('month', -1, date_trunc('month', current_date))
        {% endif %}
    ),

    normalized as (
        select
            snapshot_month,
            coalesce(peer_group_segment,      '__ALL__') as peer_group_segment,
            coalesce(peer_group_region,       '__ALL__') as peer_group_region,
            coalesce(peer_group_product_tier, '__ALL__') as peer_group_product_tier,
            company_count,
            * exclude (snapshot_month, peer_group_segment, peer_group_region,
                       peer_group_product_tier, company_count)
        from src
    )

    {% for metric_id, bench_suffix, stat_id, stat_prefix in pairs %}
    select
        snapshot_month,
        peer_group_segment,
        peer_group_region,
        peer_group_product_tier,
        '{{ metric_id }}'::varchar              as metric_id,
        '{{ stat_id }}'::varchar                as statistic,
        {{ stat_prefix }}_{{ bench_suffix }}::float as value,
        company_count
    from normalized
    {% if not loop.last %}union all{% endif %}
    {% endfor %}
