# Reference this view as omni_dbt_saas__int_saas__opportunity_line_items
schema_label: ""

schema: omni_dbt_saas
table_name: INT_SAAS__OPPORTUNITY_LINE_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  opportunity_id:
    sql: '"OPPORTUNITY_ID"'
    format: ID

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID

  created_date:
    sql: '"CREATED_DATE"'

  quantity:
    sql: '"QUANTITY"'

  list_price:
    sql: '"LIST_PRICE"'

  sale_price:
    sql: '"SALE_PRICE"'

  total_price:
    sql: '"TOTAL_PRICE"'

  arr:
    sql: '"ARR"'

  acv:
    sql: '"ACV"'

  tcv:
    sql: '"TCV"'

  contract_term_months:
    sql: '"CONTRACT_TERM_MONTHS"'

  description:
    sql: '"DESCRIPTION"'

  service_date:
    sql: '"SERVICE_DATE"'

  as_of_date:
    sql: '"AS_OF_DATE"'

  year_offset:
    sql: '"YEAR_OFFSET"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_saas__opportunity_line_items
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: saas
    materialized: table
  code: |-
    WITH PARAMS AS (
      SELECT 
        CURRENT_DATE() AS AS_OF_DATE,
        -- Dynamic offset to move 2025 data to 2026
        (YEAR(CURRENT_DATE()) - 2025) AS YEAR_OFFSET 
    )

    SELECT
      -- Use REPLACE to swap the original CREATED_DATE with the shifted version
      * REPLACE (
          DATEADD(MONTH, P.YEAR_OFFSET * 12, CREATED_DATE) AS CREATED_DATE
      )
    FROM {{ ref('stg_saas__opportunity_line_items') }}
    CROSS JOIN PARAMS P
    -- Filter: Line items only appear once their shifted creation date has passed
    WHERE DATEADD(MONTH, P.YEAR_OFFSET * 12, CREATED_DATE) <= P.AS_OF_DATE
    ORDER BY CREATED_DATE DESC
