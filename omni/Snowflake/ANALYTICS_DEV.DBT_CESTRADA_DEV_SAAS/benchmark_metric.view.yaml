# Reference this view as analytics_dev_dbt_cestrada_dev_saas__benchmark_metric
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_DEV_SAAS
table_name: BENCHMARK_METRIC

dimensions:
  metric_id:
    sql: '"METRIC_ID"'
    format: ID

  name:
    sql: '"NAME"'

  category:
    sql: '"CATEGORY"'

  denominator_type:
    sql: '"DENOMINATOR_TYPE"'

  higher_is_better:
    sql: '"HIGHER_IS_BETTER"'

  format:
    sql: '"FORMAT"'

measures:
  count:
    aggregate_type: count
