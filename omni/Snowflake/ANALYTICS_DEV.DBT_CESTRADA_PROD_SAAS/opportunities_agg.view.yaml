# Reference this view as analytics_dev_dbt_cestrada_prod_saas__opportunities_agg
description: Pre-aggregated opportunities rollup at the grain of stage_name x
  account_id. Used for aggregate awareness against the Opportunities base view.

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_SAAS
table_name: OPPORTUNITIES_AGG

dimensions:
  stage_name:
    sql: '"STAGE_NAME"'

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

  amount:
    sql: '"AMOUNT"'

  total_opps:
    sql: '"TOTAL_OPPS"'

measures:
  count:
    aggregate_type: count

# Reference this view as analytics_dev_dbt_cestrada_prod_saas__opportunities

materialized_query:
  fields:
    analytics_dev_dbt_cestrada_prod_saas__opportunities.account_id: ACCOUNT_ID
    analytics_dev_dbt_cestrada_prod_saas__opportunities.stage_name: STAGE_NAME
    analytics_dev_dbt_cestrada_prod_saas__opportunities.count: TOTAL_OPPS
    analytics_dev_dbt_cestrada_prod_saas__opportunities.amount_sum: AMOUNT
  base_view: analytics_dev_dbt_cestrada_prod_saas__opportunities
