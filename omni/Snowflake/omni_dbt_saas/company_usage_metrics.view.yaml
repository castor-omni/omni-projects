# Reference this view as omni_dbt_saas__company_usage_metrics
schema_label: ""
#This description was pulled from dbt.
description: |
  Per-company metric values in long form. GRAIN: one row per (account_id, snapshot_month, metric_id). The value is the company's own measurement and is independent of any peer group — do not confuse with the peer-relative ranks in company_percentile_rank, which sit at a finer grain. segment / region / product_tier are the company's OWN attributes (not a peer-group definition).

schema: omni_dbt_saas
table_name: COMPANY_USAGE_METRICS

dimensions:
  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Company identifier.

  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'
    #This description was pulled from dbt.
    description: Month of the snapshot (truncated to month start).

  segment:
    sql: '"SEGMENT"'
    #This description was pulled from dbt.
    description: The company's own segment.

  region:
    sql: '"REGION"'
    #This description was pulled from dbt.
    description: The company's own region.

  product_tier:
    sql: '"PRODUCT_TIER"'
    #This description was pulled from dbt.
    description: The company's own product tier.

  metric_id:
    sql: '"METRIC_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Metric key. Foreign key to benchmark_metric.

  value:
    sql: '"VALUE"'
    #This description was pulled from dbt.
    description: |
      The company's value for this metric in this month. Nullable: per- active-user-of-type rate metrics are NULL when the company had no active users of that type during the month.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: company_usage_metrics
  target_schema: DBT_CESTRADA_PROD
  description: |
    Per-company metric values in long form. GRAIN: one row per (account_id, snapshot_month, metric_id). The value is the company's own measurement and is independent of any peer group — do not confuse with the peer-relative ranks in company_percentile_rank, which sit at a finer grain. segment / region / product_tier are the company's OWN attributes (not a peer-group definition).
  config:
    schema: saas
    materialized: incremental
  code: |-
    -- models/02-mart/saas/company_usage_metrics.sql

    {{ config(materialized='incremental', unique_key=['account_id','snapshot_month','metric_id']) }}

    {% set metrics = [
        'total_users', 'total_admin_users', 'total_creator_users', 'total_viewer_users',
        'total_events', 'total_agentic_events', 'total_api_events', 'total_ui_events', 'total_admin_other_events',
        'events_per_user', 'agentic_events_per_user', 'api_events_per_user', 'ui_events_per_user', 'admin_other_events_per_user',
        'admin_other_events_per_admin_user', 'agentic_events_per_creator_user',
        'ui_events_per_creator_user', 'ui_events_per_viewer_user'
    ] %}

    with src as (
        select * from {{ ref('int_saas__company_usage') }}

        {% if is_incremental() %}
            where snapshot_month >= dateadd('month', -1, date_trunc('month', current_date))
        {% endif %}
    )

    {% for m in metrics %}
    select
        account_id,
        snapshot_month,
        segment,
        region,
        product_tier,
        '{{ m }}'::varchar      as metric_id,
        {{ m }}::float          as value
    from src
    {% if not loop.last %}union all{% endif %}
    {% endfor %}
