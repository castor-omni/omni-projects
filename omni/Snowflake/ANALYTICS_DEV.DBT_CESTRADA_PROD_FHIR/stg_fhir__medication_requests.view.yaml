# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__stg_fhir__medication_requests
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: STG_FHIR__MEDICATION_REQUESTS

dimensions:
  authored_on:
    sql: '"AUTHORED_ON"'

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  dosage_instructions_as_needed:
    sql: '"DOSAGE_INSTRUCTIONS_AS_NEEDED"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_fhir__medication_requests
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: view
  code: |-
    with raw as (
        select v.resource_raw
        from {{ source("fhir", "raw_fhir") }},
        lateral flatten(input => variant_col:entry) as f,
        lateral (select f.value:resource::variant as resource_raw) as v
        where lower(v.resource_raw:"resourceType"::varchar) = 'medicationrequest'
    )
    select
        resource_raw:"authoredOn"::date as authored_on,
        replace(resource_raw:"subject"."reference"::varchar,'urn:uuid:','') as patient_id,
        replace(resource_raw:"context"."reference"::varchar,'urn:uuid:','') as encounter_id,
        replace(resource_raw:"reasonReference"[0]:"reference"::varchar,'urn:uuid:','') as condition_id,
        resource_raw:"status"::varchar as status,
        try_to_boolean(resource_raw:"dosageInstruction"[0]."asNeededBoolean"::varchar) as dosage_instructions_as_needed,
        resource_raw,
    from raw
  referenced_by: [ int_fhir__medication_requests, medication_requests ]
