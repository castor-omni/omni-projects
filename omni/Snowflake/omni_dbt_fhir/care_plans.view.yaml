# Reference this view as omni_dbt_fhir__care_plans
schema_label: ""
#This description was pulled from dbt.
description: Contains information about patient care plans

schema: omni_dbt_fhir
table_name: CARE_PLANS

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the patient

  service_provider_id:
    sql: '"SERVICE_PROVIDER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the healthcare provider responsible for the care plan

  condition_id:
    sql: '"CONDITION_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier for the condition being addressed by the care plan

  status:
    sql: '"STATUS"'
    #This description was pulled from dbt.
    description: Current status of the care plan (e.g., active, completed, cancelled)

  category:
    sql: '"CATEGORY"'
    #This description was pulled from dbt.
    description: Category or type of the care plan

  start_ts:
    sql: '"START_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the care plan was initiated

  end_ts:
    sql: '"END_TS"'
    #This description was pulled from dbt.
    description: Timestamp when the care plan was completed or is expected to end

  activity:
    sql: '"ACTIVITY"'
    #This description was pulled from dbt.
    description: Detailed information about planned activities or interventions

  resource_raw:
    sql: '"RESOURCE_RAW"'
    #This description was pulled from dbt.
    description: Raw FHIR resource data for the care plan

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: care_plans
  target_schema: DBT_CESTRADA_PROD
  description: Contains information about patient care plans
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_fhir__care_plans')) }}
    from {{ ref('int_fhir__care_plans') }}
