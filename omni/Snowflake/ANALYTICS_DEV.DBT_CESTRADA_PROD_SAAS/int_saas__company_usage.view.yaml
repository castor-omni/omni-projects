# Reference this view as analytics_dev_dbt_cestrada_prod_saas__int_saas__company_usage
#This description was pulled from dbt.
description: |
  One row per (account_id, snapshot_month) with monthly usage metrics per company. Sourced from int_saas__usage_events joined to int_saas__sessions for user_role -> user_type derivation.
  Pair this in the semantic layer with fct_benchmark_distribution to surface "my company vs. peer distribution" comparisons. Filter to a single account_id (typically via user attribute) to identify the logged-in user's company.
  Semantics: - Active-in-role: a user counted in admin/creator/viewer reflects
    whether they were active in that role during the month. Buckets can
    sum to MORE than total_users for multi-role users.
  - Per-active-user-of-type rates are NULL when that user type had no
    active users that month. Downstream AVG and PERCENTILE_CONT ignore
    nulls, giving "among adopters" semantics.
  - Current in-progress month is excluded.

catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_SAAS
table_name: INT_SAAS__COMPANY_USAGE

dimensions:
  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Source account identifier.

  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'
    #This description was pulled from dbt.
    description: First day of the calendar month. Current month excluded.

  segment:
    sql: '"SEGMENT"'
    #This description was pulled from dbt.
    description: SMB / Mid-Market / Enterprise

  region:
    sql: '"REGION"'
    #This description was pulled from dbt.
    description: North America / EMEA / APAC

  product_tier:
    sql: '"PRODUCT_TIER"'
    #This description was pulled from dbt.
    description: Product tier / plan

  total_users:
    sql: '"TOTAL_USERS"'
    #This description was pulled from dbt.
    description: Distinct users with at least one event in the month.

  total_admin_users:
    sql: '"TOTAL_ADMIN_USERS"'
    #This description was pulled from dbt.
    description: Distinct users active as user_role = Admin.

  total_creator_users:
    sql: '"TOTAL_CREATOR_USERS"'
    #This description was pulled from dbt.
    description: Distinct users active as user_role in (Builder, Data Engineer).

  total_viewer_users:
    sql: '"TOTAL_VIEWER_USERS"'
    #This description was pulled from dbt.
    description: Distinct users active as user_role in (Analyst, Viewer).

  total_events:
    sql: '"TOTAL_EVENTS"'
    #This description was pulled from dbt.
    description: Distinct events in the month.

  total_agentic_events:
    sql: '"TOTAL_AGENTIC_EVENTS"'
    #This description was pulled from dbt.
    description: Distinct events of type AI/Agentic.

  total_api_events:
    sql: '"TOTAL_API_EVENTS"'
    #This description was pulled from dbt.
    description: Distinct events of type API.

  total_ui_events:
    sql: '"TOTAL_UI_EVENTS"'
    #This description was pulled from dbt.
    description: Distinct events of type UI Feature.

  total_admin_other_events:
    sql: '"TOTAL_ADMIN_OTHER_EVENTS"'
    #This description was pulled from dbt.
    description: Distinct events of type Admin/Other.

  events_per_user:
    sql: '"EVENTS_PER_USER"'

  agentic_events_per_user:
    sql: '"AGENTIC_EVENTS_PER_USER"'

  api_events_per_user:
    sql: '"API_EVENTS_PER_USER"'

  ui_events_per_user:
    sql: '"UI_EVENTS_PER_USER"'

  admin_other_events_per_user:
    sql: '"ADMIN_OTHER_EVENTS_PER_USER"'

  admin_other_events_per_admin_user:
    sql: '"ADMIN_OTHER_EVENTS_PER_ADMIN_USER"'
    #This description was pulled from dbt.
    description: Admin/Other events divided by total_admin_users. NULL if no admin
      users active.

  agentic_events_per_creator_user:
    sql: '"AGENTIC_EVENTS_PER_CREATOR_USER"'
    #This description was pulled from dbt.
    description: AI/Agentic events divided by total_creator_users. NULL if no
      creators active.

  ui_events_per_creator_user:
    sql: '"UI_EVENTS_PER_CREATOR_USER"'
    #This description was pulled from dbt.
    description: UI Feature events divided by total_creator_users. NULL if no
      creators active.

  ui_events_per_viewer_user:
    sql: '"UI_EVENTS_PER_VIEWER_USER"'
    #This description was pulled from dbt.
    description: UI Feature events divided by total_viewer_users. NULL if no viewers active.

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_saas__company_usage
  target_schema: DBT_CESTRADA_PROD
  description: |
    One row per (account_id, snapshot_month) with monthly usage metrics per company. Sourced from int_saas__usage_events joined to int_saas__sessions for user_role -> user_type derivation.
    Pair this in the semantic layer with fct_benchmark_distribution to surface "my company vs. peer distribution" comparisons. Filter to a single account_id (typically via user attribute) to identify the logged-in user's company.
    Semantics: - Active-in-role: a user counted in admin/creator/viewer reflects
      whether they were active in that role during the month. Buckets can
      sum to MORE than total_users for multi-role users.
    - Per-active-user-of-type rates are NULL when that user type had no
      active users that month. Downstream AVG and PERCENTILE_CONT ignore
      nulls, giving "among adopters" semantics.
    - Current in-progress month is excluded.
  config:
    schema: saas
    materialized: table
  code: |-
    /*
      One row per (account_id, snapshot_month) with monthly usage metrics.

      Notes on semantics:
      - user_type is derived from user_role:
          Admin       -> Admin
          Builder, DE -> Creator
          Analyst, V  -> Viewer
          (anything else falls through; currently no Other bucket is materialized)
      - Active-in-role semantics: a user counted in admin/creator/viewer reflects
        whether they were active *in that role* during the month. Buckets can sum
        to MORE than total_users for users who held multiple roles in the month.
      - Per-total-user metrics divide by total active users in the month.
      - Per-active-user-of-type metrics divide by the count of active users of
        that specific type. NULL when that user type was not active that month;
        AVG/PERCENTILE_CONT downstream will ignore those nulls, yielding "among
        companies with adoption of this type" distribution semantics.
      - Current in-progress month is excluded.
    */

    with events as (

        select
            account_id,
            user_id,
            session_id,
            id                                       as event_id,
            date_trunc('month', event_timestamp)     as snapshot_month,
            account_segment                          as segment,
            region,
            product_tier,

            -- derive event_type from event_name, same as semantic layer
            case
                when event_name in ('AI Copilot', 'AI Querier', 'Workflows')
                    then 'AI/Agentic'
                when event_name in ('API', 'Reporting API')
                    then 'API'
                when event_name in ('Comments', 'Dashboard Builder', 'Exports', 'Mentions',
                                    'Notifications', 'Realtime Alerts', 'Segmentation', 'Shared Spaces')
                    then 'UI Feature'
                when event_name = 'Admin'
                    then 'Admin/Other'
                else 'Other'
            end                                      as event_type

        from {{ ref('int_saas__usage_events') }}

        where event_timestamp is not null
          and date_trunc('month', event_timestamp) < date_trunc('month', current_date)

        {% if is_incremental() %}
            and date_trunc('month', event_timestamp)
                >= dateadd('month', -1, date_trunc('month', current_date))
        {% endif %}

    ),

    sessions as (

        select
            id        as session_id,
            user_id,
            user_role,
            case
                when user_role = 'Admin'                        then 'Admin'
                when user_role in ('Builder', 'Data Engineer')  then 'Creator'
                when user_role in ('Analyst', 'Viewer')         then 'Viewer'
                else 'Other'
            end as user_type

        from {{ ref('int_saas__sessions') }}

    ),

    events_with_user_type as (

        select
            e.account_id,
            e.user_id,
            e.event_id,
            e.event_type,
            e.snapshot_month,
            e.segment,
            e.region,
            e.product_tier,
            coalesce(s.user_type, 'Other') as user_type

        from events e
        left join sessions s
            on  e.session_id = s.session_id
            and e.user_id    = s.user_id

    ),

    aggregated as (

        select
            account_id,
            snapshot_month,
            max(segment)      as segment,
            max(region)       as region,
            max(product_tier) as product_tier,

            -- ── active users ────────────────────────────────────────────────────
            count(distinct user_id)                                                  as total_users,
            count(distinct case when user_type = 'Admin'   then user_id end)         as total_admin_users,
            count(distinct case when user_type = 'Creator' then user_id end)         as total_creator_users,
            count(distinct case when user_type = 'Viewer'  then user_id end)         as total_viewer_users,

            -- ── events by type ──────────────────────────────────────────────────
            count(distinct event_id)                                                 as total_events,
            count(distinct case when event_type = 'AI/Agentic'  then event_id end)   as total_agentic_events,
            count(distinct case when event_type = 'API'         then event_id end)   as total_api_events,
            count(distinct case when event_type = 'UI Feature'  then event_id end)   as total_ui_events,
            count(distinct case when event_type = 'Admin/Other' then event_id end)   as total_admin_other_events,

            -- ── per-total-user rates ─────────────────────────────────────────────
            case when count(distinct user_id) = 0 then null
                 else count(distinct event_id)::float
                      / count(distinct user_id) end                                  as events_per_user,

            case when count(distinct user_id) = 0 then null
                 else count(distinct case when event_type = 'AI/Agentic'
                                          then event_id end)::float
                      / count(distinct user_id) end                                  as agentic_events_per_user,

            case when count(distinct user_id) = 0 then null
                 else count(distinct case when event_type = 'API'
                                          then event_id end)::float
                      / count(distinct user_id) end                                  as api_events_per_user,

            case when count(distinct user_id) = 0 then null
                 else count(distinct case when event_type = 'UI Feature'
                                          then event_id end)::float
                      / count(distinct user_id) end                                  as ui_events_per_user,

            case when count(distinct user_id) = 0 then null
                 else count(distinct case when event_type = 'Admin/Other'
                                          then event_id end)::float
                      / count(distinct user_id) end                                  as admin_other_events_per_user,

            -- ── per-active-user-of-type rates ────────────────────────────────────
            case when count(distinct case when user_type = 'Admin' then user_id end) = 0 then null
                 else count(distinct case when event_type = 'Admin/Other'
                                          then event_id end)::float
                      / count(distinct case when user_type = 'Admin'
                                            then user_id end) end                    as admin_other_events_per_admin_user,

            case when count(distinct case when user_type = 'Creator' then user_id end) = 0 then null
                 else count(distinct case when event_type = 'AI/Agentic'
                                          then event_id end)::float
                      / count(distinct case when user_type = 'Creator'
                                            then user_id end) end                    as agentic_events_per_creator_user,

            case when count(distinct case when user_type = 'Creator' then user_id end) = 0 then null
                 else count(distinct case when event_type = 'UI Feature'
                                          then event_id end)::float
                      / count(distinct case when user_type = 'Creator'
                                            then user_id end) end                    as ui_events_per_creator_user,

            case when count(distinct case when user_type = 'Viewer' then user_id end) = 0 then null
                 else count(distinct case when event_type = 'UI Feature'
                                          then event_id end)::float
                      / count(distinct case when user_type = 'Viewer'
                                            then user_id end) end                    as ui_events_per_viewer_user

        from events_with_user_type
        group by 1, 2

    )

    select * from aggregated
  referenced_by: [ company_percentile_rank, company_usage_metrics, int_saas__usage_benchmarks ]
