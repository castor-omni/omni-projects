# Reference this view as analytics_prod_dbt_cestrada__opportunities_agg
description: Pre-aggregated opportunities rollup at the grain of stage_name x
  account_id. Used for aggregate awareness against the Opportunities base view.

catalog: ANALYTICS_PROD
schema: DBT_CESTRADA
table_name: OPPORTUNITIES_AGG

dimensions:
  stage_name:
    sql: '"STAGE_NAME"'

  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

  # Pre-aggregated column; exposed as the amount_total measure rather than a dimension
  amount:
    sql: '"AMOUNT"'
    description: Pre-summed iARR for this stage/account combination. Not a per-deal amount.
    hidden: true

  total_opps:
    sql: '"TOTAL_OPPS"'
    description: Pre-counted opportunities for this stage/account combination.
    hidden: true

measures:
  # Raw row count of the agg table (one row per stage/account), not an opportunity count
  count:
    description: Row count of the aggregate table. Use opportunity_count for
      opportunity volume.
    hidden: true
    aggregate_type: count

  amount_total:
    sql: ${amount}
    label: Amount
    format: usdcurrency_0
    description: Total iARR, re-summed from the pre-aggregated AMOUNT column.
    aggregate_type: sum

  opportunity_count:
    sql: ${total_opps}
    label: Opportunity Count
    format: number_0
    description: Total opportunities, re-summed from the pre-aggregated TOTAL_OPPS column.
    aggregate_type: sum

materialized_query:
  fields:
    analytics_prod_dbt_cestrada__opportunities.account_id: ACCOUNT_ID
    analytics_prod_dbt_cestrada__opportunities.stage_name: STAGE_NAME
    analytics_prod_dbt_cestrada__opportunities.count: TOTAL_OPPS
    analytics_prod_dbt_cestrada__opportunities.amount_sum: AMOUNT
  base_view: analytics_prod_dbt_cestrada__opportunities
