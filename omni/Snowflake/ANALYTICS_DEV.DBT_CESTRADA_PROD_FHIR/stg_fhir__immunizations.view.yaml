# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__stg_fhir__immunizations
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: STG_FHIR__IMMUNIZATIONS

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  encounter_id:
    sql: '"ENCOUNTER_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  code:
    sql: '"CODE"'

  name:
    sql: '"NAME"'

  date_ts:
    sql: '"DATE_TS"'

  primary_source:
    sql: '"PRIMARY_SOURCE"'

  not_given:
    sql: '"NOT_GIVEN"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_fhir__immunizations
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: view
  code: |-
    with raw as (
        select v.resource_raw
        from {{ source("fhir", "raw_fhir") }},
        lateral flatten(input => variant_col:entry) as f,
        lateral (select f.value:resource::variant as resource_raw) as v
        where lower(v.resource_raw:"resourceType"::varchar) = 'immunization'
    )
    select
        replace(resource_raw:"patient"."reference"::varchar,'urn:uuid:','') as patient_id,
        replace(resource_raw:"encounter"."reference"::varchar,'urn:uuid:','') as encounter_id,
        resource_raw:"status"::varchar as status,
        resource_raw:"vaccineCode"."coding"[0]."code"::varchar as code,
        resource_raw:"vaccineCode".text::varchar as name,
        resource_raw:"date"::timestamp as date_ts,
        try_to_boolean(resource_raw:"primarySource"::varchar) as primary_source,
        try_to_boolean(resource_raw:"notGiven"::varchar) as not_given,
        resource_raw
    from raw
  referenced_by: [ immunizations, int_fhir__immunizations ]
