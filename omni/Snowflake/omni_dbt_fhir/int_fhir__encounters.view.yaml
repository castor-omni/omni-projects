# Reference this view as omni_dbt_fhir__int_fhir__encounters
schema_label: ""

schema: omni_dbt_fhir
table_name: INT_FHIR__ENCOUNTERS

dimensions:
  start_ts:
    sql: '"START_TS"'

  end_ts:
    sql: '"END_TS"'

  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  class:
    sql: '"CLASS"'

  type:
    sql: '"TYPE"'

  service_provider_id:
    sql: '"SERVICE_PROVIDER_ID"'
    format: ID

  reason_code:
    sql: '"REASON_CODE"'

  reason:
    sql: '"REASON"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__encounters
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
        timestampadd(year, extract(year, current_date()) - 2016, start_ts) as start_ts,
        timestampadd(year, extract(year, current_date()) - 2016, end_ts) as end_ts,
        {{ dbt_utils.star(ref("stg_fhir__encounters"), except=["start_ts", "end_ts"]) }}
    from {{ ref("stg_fhir__encounters") }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, start_ts)
        < current_date()
  referenced_by: [ encounters ]
