# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__stg_fhir__allergies
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: STG_FHIR__ALLERGIES

dimensions:
  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  code:
    sql: '"CODE"'

  category:
    sql: '"CATEGORY"'

  description:
    sql: '"DESCRIPTION"'

  type:
    sql: '"TYPE"'

  asserted_ts:
    sql: '"ASSERTED_TS"'

  criticality:
    sql: '"CRITICALITY"'

  clinical_status:
    sql: '"CLINICAL_STATUS"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_fhir__allergies
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: view
  code: |-
    with raw as (
        select v.resource_raw
        from {{ source("fhir", "raw_fhir") }},
        lateral flatten(input => variant_col:entry) as f,
        lateral (select f.value:resource::variant as resource_raw) as v
        where lower(v.resource_raw:"resourceType"::varchar) = 'allergyintolerance'
    )
    select
        replace(resource_raw:"patient"."reference"::varchar,'urn:uuid:','') as patient_id,
        resource_raw:"code"."coding"[0]."code"::varchar as code,
        resource_raw:"category"[0]::varchar as category,
        resource_raw:"code"."coding"[0]."display"::varchar as description,
        resource_raw:"type"::varchar as type,
        resource_raw:"assertedDate"::timestamp as asserted_ts,
        resource_raw:"criticality"::varchar as criticality,
        resource_raw:"clinicalStatus"::varchar as clinical_status,
        resource_raw
    from raw
  referenced_by: [ allergies, int_fhir__allergies ]
