# Reference this view as analytics_dev_dbt_cestrada_prod__monthly_orders_rollup
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD
table_name: MONTHLY_ORDERS_ROLLUP

dimensions:
  created_at_month_:
    sql: '"CREATED_AT[MONTH]"'

  total_sales:
    sql: '"TOTAL_SALES"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: monthly_orders_rollup
  target_schema: DBT_CESTRADA_PROD
  config:
    materialized: view
  code: |-
    SELECT DATE_TRUNC('MONTH', CONVERT_TIMEZONE('UTC', 'America/New_York', "CREATED_AT")) AS "CREATED_AT[MONTH]",
        COALESCE(SUM("SALE_PRICE"), 0) AS "TOTAL_SALES"
    FROM {{ref('order_items')}} AS "omni_dbt_ecomm__order_items"
    WHERE "STATUS" NOT IN ('Cancelled', 'Returned') OR "STATUS" IS NULL
    GROUP BY 1
