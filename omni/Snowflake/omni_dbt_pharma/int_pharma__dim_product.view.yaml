# Reference this view as omni_dbt_pharma__int_pharma__dim_product
schema_label: ""

schema: omni_dbt_pharma
table_name: INT_PHARMA__DIM_PRODUCT

dimensions:
  productid:
    sql: '"PRODUCTID"'

  brandname:
    sql: '"BRANDNAME"'

  genericname:
    sql: '"GENERICNAME"'

  therapeuticarea:
    sql: '"THERAPEUTICAREA"'

  form:
    sql: '"FORM"'

  strength:
    sql: '"STRENGTH"'

  ndc:
    sql: '"NDC"'

  launchdate:
    sql: '"LAUNCHDATE"'

  marketid:
    sql: '"MARKETID"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_pharma__dim_product
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: pharma
    materialized: table
  code: |-
    with base as (
      select * from {{ ref('stg_pharma__dim_product') }}
    ),
    anchor as (
      select max(date_from_parts(LAUNCHDATE, 1, 1)) as anchor_date from base
    )
    select
      t.PRODUCTID as PRODUCTID,
      t.BRANDNAME as BRANDNAME,
      t.GENERICNAME as GENERICNAME,
      t.THERAPEUTICAREA as THERAPEUTICAREA,
      t.FORM as FORM,
      t.STRENGTH as STRENGTH,
      t.NDC as NDC,
      cast(
        extract(
          year from {{ pharma_shift_date('date_from_parts(t.LAUNCHDATE, 1, 1)', 'anchor.anchor_date') }}
        ) as number(38, 0)
      ) as LAUNCHDATE,
      t.MARKETID as MARKETID
    from base t
    cross join anchor
  referenced_by: [ dim_product ]
