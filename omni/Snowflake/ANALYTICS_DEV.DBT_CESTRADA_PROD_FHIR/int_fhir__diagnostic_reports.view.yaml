# Reference this view as analytics_dev_dbt_cestrada_prod_fhir__int_fhir__diagnostic_reports
catalog: ANALYTICS_DEV
schema: DBT_CESTRADA_PROD_FHIR
table_name: INT_FHIR__DIAGNOSTIC_REPORTS

dimensions:
  effective_ts:
    sql: '"EFFECTIVE_TS"'

  issued_ts:
    sql: '"ISSUED_TS"'

  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  status:
    sql: '"STATUS"'

  code:
    sql: '"CODE"'

  name:
    sql: '"NAME"'

  result:
    sql: '"RESULT"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__diagnostic_reports
  target_schema: DBT_CESTRADA_PROD
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      timestampadd(year, extract(year, current_date()) - 2016, effective_ts) as effective_ts,
      timestampadd(year, extract(year, current_date()) - 2016, issued_ts) as issued_ts,
      {{ dbt_utils.star(ref('stg_fhir__diagnostic_reports'), except=["effective_ts", "issued_ts"]) }}
    from {{ ref('stg_fhir__diagnostic_reports') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, issued_ts)
        < current_date()
  referenced_by: [ diagnostic_reports ]
